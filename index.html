  const shape = type === 'mc'
    ? '{"title":"short Chinese title","prompt":"question text","options":["option A","option B","option C","option D"],"answer":0,"explain":"..."}'
    : '{"title":"short Chinese title","prompt":"question text with every number needed","currency":"$","blanks":[{"label":"what to fill in","answer":12345,"unit":"money"}],"explain":"..."}';
  const prompt = `You write practice questions for HKU ACCT 2102 (Intermediate Accounting I, IFRS; lecture slides by Dr. Charles Kang). Write ONE new ${type === 'mc' ? 'single-answer multiple-choice' : 'numerical calculation'} question on Chapter ${ch}.

Chapter ${ch} key points:
${CH_SUM[ch]}

The student already has these questions. Test a different point, or the same point in a new scenario:
${existing}

Write in Simplified Chinese and keep key terms in English in brackets where helpful. The question must be answerable from the key points above, with exactly one correct answer under the treatment taught in this course.
Reply with ONLY one JSON object of this shape:
${shape}
Rules:
${type === 'mc' ? '- exactly 4 options; "answer" is the 0-based index of the correct option; distractors should be mistakes students plausibly make.' : '- 1 to 4 blanks; "answer" is a plain number (no commas; losses and decreases are negative); "unit" is "money" or "eps".\n- Check the arithmetic carefully before replying.'}
- "explain" is 2 to 6 sentences in Chinese explaining why, showing the working for calculations; use \\n for line breaks.`;
  const ctl = new AbortController();
  UI.qai = {...UI.qai, status:'busy', err:'', ctl};
  const side = document.getElementById('qside'); if (side) side.innerHTML = quizSideHTML();
  try {
    const j = await UI.sample.json(prompt, {signal:ctl.signal, cache:false, task:'quiz'});
    const q = parseAIQ(j, ch, type);
    QZ.ai.unshift(q); QZ.ch = 'all'; QZ.type = 'all'; QZ.wrong = false; qSave();
    UI.qai = {...UI.qai, status:'idle', err:'', ctl:null};
    renderQuiz();
    const el = document.getElementById('q-' + q.id); if (el) el.scrollIntoView({block:'start', behavior:'smooth'});
    return;
  } catch (e) {
    const code = e && e.code;
    if (code === 'cancelled') UI.qai = {...UI.qai, status:'idle', err:'', ctl:null};
    else if (['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'].includes(code)) { UI.sample = window.AccountingAI; UI.aiProvider = 'GPT'; UI.aiConnected = false; UI.aiMessage = 'Claude 连接不可用，请连接云端 GPT。'; UI.qai = {...UI.qai, status:'idle', err:'', ctl:null}; }
    else {
      const msg = aiFailureMessage(e, 'AI 的回答不是有效格式，请再点一次。');
      if (['not_authenticated','gateway_auth','offline'].includes(code)) { UI.aiConnected = false; UI.aiMessage = msg; }
      UI.qai = {...UI.qai, status:'error', ctl:null, err:msg};
    }
  }
  if (S.settings.view === 'quiz') renderQuiz();
}

/* ================= events ================= */
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act], [data-t]');
  if (!el) return;
  if (el.dataset.t != null && !el.dataset.act) { const t = TRACES[+el.dataset.t]; if (t) openTrace(t); return; }
  const act = el.dataset.act, v = el.dataset.v, id = el.dataset.id;
  const qid = el.dataset.q, q = qid ? findQ(qid) : null;
  switch (act) {
    case 'view': S.settings.view = v; save(); $('#trace').hidden = true; renderAll(); window.scrollTo(0, 0); break;
    case 'qCh': QZ.ch = v === 'all' ? 'all' : +v; qSave(); renderQuiz(); break;
    case 'qType': QZ.type = v; qSave(); renderQuiz(); break;
    case 'qSubmit': if (q) qSubmit(q); break;
    case 'qPeek': if (q) { const a = qa(q.id); a.done = true; a.ok = false; a.peek = true; a.exp = true; a.wrong = true; a.detail = {}; if (q.type === 'match') a.detail.items = q.items.map(([, ans], i) => +((a.match || {})[i]) === ans && (a.match || {})[i] !== '' && (a.match || {})[i] != null); if (q.type === 'num') a.detail.blanks = q.blanks.map(() => false); qSave(); refreshCard(q.id); } break;
    case 'qRetry': if (q) { const a = qa(q.id); a.done = false; a.ok = false; a.detail = {}; a.msg = ''; qSave(); refreshCard(q.id); } break;
    case 'qShowExp': if (q) { qa(q.id).exp = true; qSave(); refreshCard(q.id); } break;
    case 'qRedo': if (q) { const w = !!(QZ.ans[q.id] && QZ.ans[q.id].wrong); QZ.ans[q.id] = w ? {wrong:true} : {}; qSave(); refreshCard(q.id); } break;
    case 'qJeAdd': if (q) { jeRows(qa(q.id)).push({a:'', dr:'', cr:''}); qSave(); refreshCard(q.id); } break;
    case 'qJeDel': if (q) { const rows = jeRows(qa(q.id)); if (rows.length > 1) { rows.splice(+el.dataset.i, 1); qSave(); refreshCard(q.id); } } break;
    case 'qLab': if (q) loadLab(q); break;
    case 'qReset': { const snapQ = JSON.stringify(QZ.ans); QZ.ans = {}; qSave(); renderQuiz(); toast('已清空全部作答记录', () => { QZ.ans = JSON.parse(snapQ); qSave(); renderQuiz(); }); break; }
    case 'qAiGo': qAiGo(); break;
    case 'qAiStop': if (UI.qai.ctl) UI.qai.ctl.abort(); break;
    case 'qAiDel': { const snapA = JSON.stringify(QZ.ai), snapAns = QZ.ans[qid]; QZ.ai = QZ.ai.filter(x => x.id !== qid); delete QZ.ans[qid]; qSave(); renderQuiz(); renderHeader(); toast('已删除这道 AI 题', () => { QZ.ai = JSON.parse(snapA); if (snapAns) QZ.ans[qid] = snapAns; qSave(); renderQuiz(); renderHeader(); }); break; }
    case 'labBack': labBack(); break;
    case 'labKeep': { const f = UI.labFrom; UI.labFrom = null; try { localStorage.removeItem(RKEY); } catch (e) {} renderAll(); if (f) toast('已保留这个情景，原来的数据已被替换。', () => restore(f.snap)); break; }
    case 'tab': S.settings.tab = v; save(); renderBoard(); break;
    case 'mode': UI.mode = v; if (v === 'custom' && !UI.custom) UI.custom = blankCustom(); renderBench(); break;
    case 'lang': S.settings.lang = v; save(); renderAll(); break;
    case 'practice': S.settings.practice = !S.settings.practice; save(); $('#trace').hidden = true; renderAll(); break;
    case 'settings': UI.showSettings = !UI.showSettings; renderHeader(); break;
    case 'aiConnection': openAIConnection(); break;
    case 'aiLogin': openAIConnection(false); startAILogin(); break;
    case 'aiStartLogin': startAILogin(); break;
    case 'aiCancelLogin': cancelAILogin(); break;
    case 'aiRefresh': refreshAIConnection(); break;
    case 'aiSaveConnection': {
      if (!saveLoginConnection()) break;
      stopLoginPolling(); UI.login = {state:'idle'}; $('#modal').hidden = true; refreshAIConnection(); break;
    }
    case 'backup': openBackup(); break;
    case 'closeModal': stopLoginPolling(); $('#modal').hidden = true; break;
    case 'dlJson': if (!UI.dl) { downloadFile('acct2102-statement-lab.json', JSON.stringify(S, null, 1)); toast('已下载备份'); break; } UI.dl.save({filename:'acct2102-statement-lab.json', data:JSON.stringify(S, null, 1)}).then(() => toast('已下载备份')).catch(e => { const m = $('#bk-msg'); if (m && e && e.code !== 'declined') m.textContent = '下载没有成功，可以改用「复制 JSON」。'; }); break;
    case 'copyJson': { const ta = $('#bk-text'); const txt = ta ? ta.value : JSON.stringify(S); try { navigator.clipboard.writeText(txt).then(() => toast('已复制'), () => { ta && ta.select(); toast('请按 Ctrl/⌘ + C 复制已选中的文本'); }); } catch (e) { ta && ta.select(); } break; }
    case 'importText': importJSON(($('#bk-text') || {}).value || ''); break;
    case 'loadSample': { const snap = snapshot(); S = sampleState(); S.settings.lang = JSON.parse(snap).settings.lang; UI.sel = null; UI.editing = null; save(); renderAll(); toast('已载入示例公司', () => restore(snap)); break; }
    case 'blank': { const snap = snapshot(); const keep = S.settings; S = blankState(); S.settings = {...S.settings, lang:keep.lang, tab:'opening'}; S.company.year = +JSON.parse(snap).company.year || 2026; UI.sel = null; UI.editing = null; UI.lastDate = null; save(); renderAll(); toast('已清空。先在「期初余额」页填上年末余额（新公司可全为零）。', () => restore(snap)); break; }
    case 'undo': if (UI.undo) { const f = UI.undo; UI.undo = null; $('#toast').hidden = true; f(); } break;
    case 'sel': if (ev.target.closest('.acts')) break; UI.sel = UI.sel === id ? null : id; renderBench(); renderBoard(); break;
    case 'clearSel': UI.sel = null; renderBench(); renderBoard(); break;
    case 'edit': editTx(id); break;
    case 'del': delTx(id); break;
    case 'cancelEdit': UI.editing = null; if (UI.mode === 'tpl') startTpl(UI.tpl); else UI.custom = blankCustom(); renderAll(); break;
    case 'addTpl': addTpl(); break;
    case 'addCustom': addCustom(); break;
    case 'custAdd': UI.custom.rows.push({a:'1000', dr:'', cr:''}); renderBench(); break;
    case 'custDel': if (UI.custom.rows.length > 1) { UI.custom.rows.splice(+el.dataset.i, 1); renderBench(); } break;
    case 'jump': jump(id); break;
    case 'closeTrace': $('#trace').hidden = true; break;
    case 'chip': { const c = R.checks.find(x => x.k === el.dataset.k); if (c) openInfo(c.zh, c.why); break; }
    case 'plMethod': S.settings.plMethod = v; save(); renderBoard(); break;
    case 'plPres': S.settings.plPres = v; save(); renderBoard(); break;
    case 'cfMethod': S.settings.cfMethod = v; save(); renderBoard(); break;
    case 'lf': UI.lf = v; renderBoard(); break;
    case 'check': checkAll(); break;
    case 'showAns': UI.showAns = !UI.showAns; renderBoard(); break;
    case 'clearGuess': UI.guesses = {}; UI.marks = {}; renderBoard(); break;
    case 'revealJE': UI.revealed.add(id); renderBoard(); break;
    case 'revealAll': R.entries.forEach(e => UI.revealed.add(e.id)); renderBoard(); break;
    case 'hideAll': UI.revealed.clear(); renderBoard(); break;
    case 'whyAll': if (UI.openWhy.size) UI.openWhy.clear(); else R.entries.forEach(e => UI.openWhy.add(e.id)); renderBoard(); break;
    case 'zeroOB': { const snap = snapshot(); S.opening = {}; S.openingShares = 0; save(); renderAll(); toast('期初余额已清零', () => restore(snap)); break; }
    case 'aiGo': aiGo(); break;
    case 'aiStop': if (UI.ai.ctl) UI.ai.ctl.abort(); break;
    case 'aiAccept': { const r = UI.ai.res; if (!r || r.empty) break; UI.editing = null; commit({date:r.date, tpl:'custom', memo:r.memo, memoUser:r.memo, adj:r.adj, groups:r.groups, calc:r.assumptions ? '假设：' + r.assumptions : '', shares:0, note:r.explain, src:'ai'}); UI.ai = {text:'', status:'idle', res:null, err:'', ctl:null}; renderBench(); break; }
    case 'aiEdit': { const r = UI.ai.res; if (!r || r.empty) break; UI.custom = {date:r.date, memo:r.memo, adj:r.adj, rows:r.groups.flat().map(l => ({a:l.a, dr:l.s > 0 ? String(l.s / 100) : '', cr:l.s < 0 ? String(-l.s / 100) : '', fn:l.fn || ''}))}; UI.mode = 'custom'; renderBench(); break; }
  }
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') { if (!$('#modal').hidden) { stopLoginPolling(); $('#modal').hidden = true; } else if (!$('#trace').hidden) $('#trace').hidden = true; return; }
  if (ev.key !== 'Enter' && ev.key !== ' ') return;
  const t = ev.target;
  if (t.matches && t.matches('[data-t]')) { ev.preventDefault(); const x = TRACES[+t.dataset.t]; if (x) openTrace(x); }
  else if (t.matches && t.matches('li.tx')) { ev.preventDefault(); const id = t.dataset.id; UI.sel = UI.sel === id ? null : id; renderBench(); renderBoard(); const n = document.querySelector(`li.tx[data-id="${id}"]`); if (n) n.focus(); }
});
document.addEventListener('input', ev => {
  const el = ev.target;
  if (el.dataset.q) {
    const a = qa(el.dataset.q);
    if (el.dataset.bi != null) { a.vals = a.vals || {}; a.vals[el.dataset.bi] = el.value; }
    else if (el.dataset.jd != null || el.dataset.jc != null) {
      const rows = jeRows(a), i = +(el.dataset.jd ?? el.dataset.jc);
      if (rows[i]) rows[i][el.dataset.jd != null ? 'dr' : 'cr'] = el.value;
      let d = 0, c = 0; rows.forEach(r => { const x = money(r.dr), y = money(r.cr); if (Number.isFinite(x)) d += x; if (Number.isFinite(y)) c += y; });
      const t = document.getElementById('qjt-' + el.dataset.q); if (t) t.innerHTML = `<span>合计</span><span>${fmt(d)}</span><span>${fmt(c)}</span><span></span>`;
    }
    qSave(); return;
  }
  if (el.dataset.f != null) {
    UI.params[el.dataset.f] = el.value;
    const box = $('#tplPreview'); if (box) box.innerHTML = tplPreviewHTML();
    const memo = $('#f-memo'); if (memo && el.id !== 'f-memo') memo.placeholder = safeMemo(TPL[UI.tpl], UI.params);
  } else if (el.dataset.c != null && el.tagName === 'INPUT') {
    UI.custom.rows[+el.dataset.i][el.dataset.c] = el.value;
    const t = customTotals(), tt = $('#cTot'); if (tt) tt.innerHTML = `<span>合计</span><span>${fmt(t.d)}</span><span>${fmt(t.c)}</span><span></span>`;
    const m = $('#custMsg'); if (m) m.innerHTML = custMsg();
  } else if (el.dataset.cm === 'memo' || el.dataset.cm === 'date') {
    UI.custom[el.dataset.cm] = el.value;
  } else if (el.dataset.g != null) {
    UI.guesses[el.dataset.g] = el.value;
  } else if (el.dataset.ai) {
    UI.ai.text = el.value;
  }
});
document.addEventListener('change', ev => {
  const el = ev.target;
  if (el.dataset.q) {
    const a = qa(el.dataset.q), q = findQ(el.dataset.q);
    if (el.dataset.opt != null && q) {
      const i = +el.dataset.opt;
      if (q.type === 'multi') { const s = new Set(a.sel || []); if (el.checked) s.add(i); else s.delete(i); a.sel = [...s].sort((x, y) => x - y); }
      else a.sel = [i];
    } else if (el.dataset.mi != null) { a.match = a.match || {}; a.match[el.dataset.mi] = el.value; }
    else if (el.dataset.ja != null) { const rows = jeRows(a); if (rows[+el.dataset.ja]) rows[+el.dataset.ja].a = el.value; }
    qSave(); return;
  }
  if (el.dataset.qz === 'wrong') { QZ.wrong = el.checked; qSave(); renderQuiz(); return; }
  if (el.dataset.qai) { UI.qai[el.dataset.qai] = el.value; return; }
  if (el.id === 'tplSel') { startTpl(el.value); renderBench(); const s = $('#tplSel'); if (s) s.focus(); return; }
  if (el.dataset.f != null && el.tagName === 'SELECT') { UI.params[el.dataset.f] = el.value; renderBench(); return; }
  if (el.dataset.f === 'date') { UI.params.date = el.value; const box = $('#tplPreview'); if (box) box.innerHTML = tplPreviewHTML(); return; }
  if (el.dataset.c != null && el.tagName === 'SELECT') { const r = UI.custom.rows[+el.dataset.i]; r[el.dataset.c] = el.value; if (el.dataset.c === 'a') r.fn = ''; renderBench(); return; }
  if (el.dataset.cm === 'adj') { UI.custom.adj = el.checked; return; }
  if (el.dataset.ob) {
    const c = el.dataset.ob, v = money(el.value);
    if (el.value.trim() && !Number.isFinite(v)) { toast('金额格式不对'); renderBoard(); return; }
    const val = Number.isFinite(v) ? v : 0;
    if (val) S.opening[c] = ACC[c].t === 'A' ? val : -val; else delete S.opening[c];
    save(); renderAll(); return;
  }
  if (el.dataset.obs) { const n = Math.round(num(el.value)); S.openingShares = n > 0 ? n : 0; save(); renderAll(); return; }
  if (el.dataset.set) {
    const k = el.dataset.set;
    if (k === 'name') S.company.name = el.value.trim() || 'Company Limited';
    else if (k === 'year') { const y = Math.round(num(el.value)); if (y > 1900 && y < 2200) S.company.year = y; }
    else if (k === 'cur') S.company.cur = el.value.trim().slice(0, 6) || '$';
    else if (k === 'tax') { const t = num(el.value); if (t >= 0 && t < 100) S.settings.tax = t; }
    else if (k === 'autoTax') S.settings.autoTax = el.checked;
    save(); renderAll(); return;
  }
  if (el.id === 'bk-file' && el.files && el.files[0]) { const fr = new FileReader(); fr.onload = () => importJSON(String(fr.result || '')); fr.readAsText(el.files[0]); }
});
document.addEventListener('toggle', ev => {
  const d = ev.target; if (!d.dataset || !d.dataset.why) return;
  if (d.open) UI.openWhy.add(d.dataset.why); else UI.openWhy.delete(d.dataset.why);
}, true);

/* ================= boot ================= */
S = load();
qLoad();
try { const lf = JSON.parse(localStorage.getItem(RKEY) || 'null'); if (lf && lf.snap && lf.qid) UI.labFrom = lf; } catch (e) {}
UI.lastDate = S.txns.length ? [...S.txns].sort((a, b) => a.date < b.date ? 1 : -1)[0].date : `${S.company.year}-01-01`;
startTpl('sale');
UI.custom = blankCustom();
renderAll();
const use = window.claude && typeof window.claude.use === 'function' ? n => window.claude.use(n).catch(() => null) : () => Promise.resolve(null);
refreshAIConnection();
use('downloads').then(d => { if (d) UI.dl = d; });
})();
</script>
</body>
</html>
