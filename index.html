<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="HKU ACCT 2102 学习工具：录入交易，自动生成日记账、分类账、试算平衡表和 IFRS 财务报表，附第 1–4 章练习题。">
<style>body{margin:0}img{max-width:100%}</style>
<title>ACCT 2102 财报实验室</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap">
<style>
:root{
  --ground:#E8EEE8;
  --sheet:#FBFCFA;
  --sheet2:#F1F5F0;
  --ink:#13201A;
  --ink2:#3A4A42;
  --muted:#65766E;
  --rule:#D2DDD4;
  --rule2:#A6B8AC;
  --accent:#1B5A4A;
  --accent-ink:#FFFFFF;
  --accent-soft:#DAE9E1;
  --dr:#1C5594;
  --cr:#94520E;
  --hl:#FBEC9E;
  --ok:#2A7845;
  --ok-soft:#DCEFE1;
  --bad:#B42318;
  --bad-soft:#FBE1DD;
  --shadow:0 1px 2px rgba(19,32,26,.05),0 6px 20px rgba(19,32,26,.07);
  --f-ui:"IBM Plex Sans","PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --f-doc:"Source Serif 4","Songti SC","Noto Serif SC","STSong",Georgia,serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0E1512;--sheet:#151E1A;--sheet2:#1B2621;--ink:#E3EBE6;--ink2:#BAC8C0;--muted:#8C9E95;
    --rule:#28352F;--rule2:#43564C;--accent:#6BC2A6;--accent-ink:#06231A;--accent-soft:#1B3A30;
    --dr:#8DB9F2;--cr:#E6AC69;--hl:#4A4213;--ok:#72CF93;--ok-soft:#173A25;--bad:#F48B80;--bad-soft:#3F1B18;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0E1512;--sheet:#151E1A;--sheet2:#1B2621;--ink:#E3EBE6;--ink2:#BAC8C0;--muted:#8C9E95;
  --rule:#28352F;--rule2:#43564C;--accent:#6BC2A6;--accent-ink:#06231A;--accent-soft:#1B3A30;
  --dr:#8DB9F2;--cr:#E6AC69;--hl:#4A4213;--ok:#72CF93;--ok-soft:#173A25;--bad:#F48B80;--bad-soft:#3F1B18;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.3);
}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--ground)}
body{background:var(--ground);color:var(--ink);font:14px/1.55 var(--f-ui);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
h1,h2,h3,h4{text-wrap:balance}
input,select,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:1520px;margin:0 auto;padding-inline:16px;padding-block:18px 72px;display:flex;flex-direction:column;gap:14px}

/* ---------- top ---------- */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
.eyebrow{font:500 11px/1.3 var(--f-num);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.brand h1{margin:3px 0 3px;font:600 30px/1.1 var(--f-doc);letter-spacing:-.01em}
.brand h1 .sub{font:400 14px/1 var(--f-ui);color:var(--muted);margin-left:10px;letter-spacing:.02em}
.co-line{font-size:13px;color:var(--ink2)}
.co-line b{font-weight:600;color:var(--ink)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--rule2);border-radius:7px;background:var(--sheet);padding:2px;gap:2px}
.seg button{border:0;background:none;border-radius:5px;padding:4px 10px;font-size:12.5px;color:var(--ink2);cursor:pointer;white-space:nowrap}
.seg button:hover{background:var(--sheet2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule2);background:var(--sheet);border-radius:7px;padding:5px 11px;font-size:12.5px;cursor:pointer;color:var(--ink);white-space:nowrap;line-height:1.4}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.btn.primary:hover{filter:brightness(1.07)}
.btn.small{padding:3px 8px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.btn .kbd{font:500 10.5px var(--f-num);color:var(--muted)}

.settings{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:12px 14px}
.settings .field{min-width:110px}
.settings .field.wide{flex:1 1 220px}
.settings .field.narrow{flex:0 0 96px;min-width:0}
.checkline{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2);padding-bottom:6px}

/* ---------- equation ---------- */
.eq{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:14px 18px;box-shadow:var(--shadow)}
.eq-terms{display:flex;flex-wrap:wrap;align-items:flex-end;gap:6px 16px;flex:1 1 520px}
.eq-term{display:flex;flex-direction:column;gap:1px;border-radius:6px;padding:2px 4px}
.eq-term .k{font-size:11.5px;color:var(--muted);letter-spacing:.03em}
.eq-term .v{font:600 27px/1.1 var(--f-doc);font-variant-numeric:tabular-nums lining-nums;white-space:nowrap}
.eq-op{font:400 28px/1.2 var(--f-doc);color:var(--muted);padding-bottom:1px}
.eq-flash{animation:flash 1.4s ease}
@keyframes flash{0%{background:var(--hl)}100%{background:transparent}}
.chips{display:flex;flex-wrap:wrap;gap:6px;flex:1 1 360px;justify-content:flex-end}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);background:var(--sheet2);border-radius:999px;padding:3px 10px 3px 5px;font-size:12px;cursor:pointer;color:var(--ink2)}
.chip:hover{border-color:var(--rule2);color:var(--ink)}
.chip .dot{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;background:var(--ok);color:var(--sheet);flex:none}
.chip.bad .dot{background:var(--bad)}

/* ---------- workspace ---------- */
.work{display:grid;grid-template-columns:minmax(300px,390px) minmax(0,1fr);gap:14px;align-items:start}
.bench{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;box-shadow:var(--shadow);position:sticky;top:calc(10px + env(safe-area-inset-top,0px));max-height:calc(100vh - 20px);overflow:auto;display:flex;flex-direction:column;min-width:0}
.board{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;box-shadow:var(--shadow);min-width:0}
@media (max-width:1000px){.work{grid-template-columns:minmax(0,1fr)}.bench{position:static;max-height:none}}
.bsec{padding:14px 16px;border-bottom:1px solid var(--rule);display:flex;flex-direction:column;gap:10px}
.bsec:last-child{border-bottom:0}
.bhead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.h2{font:600 14px/1.3 var(--f-ui);margin:0}
.h2 .count{font:500 11.5px var(--f-num);color:var(--muted);margin-left:4px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:12px;color:var(--ink2);font-weight:500}
.field input,.field select,.field textarea{width:100%;min-width:0;font-size:13.5px;padding:6px 8px;border:1px solid var(--rule2);border-radius:6px;background:var(--sheet)}
.field textarea{resize:vertical;line-height:1.5}
.affix{display:flex;align-items:stretch;border:1px solid var(--rule2);border-radius:6px;background:var(--sheet);overflow:hidden}
.affix .pre{font:12px var(--f-num);color:var(--muted);padding:0 6px;display:grid;place-items:center;background:var(--sheet2);border-right:1px solid var(--rule)}
.affix input{border:0!important;border-radius:0!important;font-family:var(--f-num)!important;font-size:13px!important}
.tdesc{font-size:12.5px;color:var(--ink2);margin:0}
.hint{font-size:12px;color:var(--muted);background:var(--sheet2);border-radius:6px;padding:6px 8px;margin:0}
.preview{border:1px dashed var(--rule2);border-radius:8px;padding:10px 10px 8px;background:var(--sheet2);display:flex;flex-direction:column;gap:6px}
.preview .ph{font:500 11px var(--f-num);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.err{color:var(--bad);font-size:12.5px;margin:0}
.calc{font:12px/1.5 var(--f-num);color:var(--ink2);margin:0}
.note{font-size:12.5px;color:var(--ink2);margin:0;border-left:3px solid var(--accent);padding:2px 0 2px 8px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mini{width:100%;border-collapse:collapse;font-size:12.5px}
.mini td{padding:1px 3px;vertical-align:baseline}
.mini td.amt{font:12px var(--f-num);text-align:right;white-space:nowrap;width:84px}
.mini td.ca{padding-left:24px}
.mini tr.gs td{height:6px}

.crow{display:grid;grid-template-columns:minmax(0,1fr) 78px 78px 26px;gap:5px;align-items:center}
.crow select,.crow input{width:100%;min-width:0;font-size:12.5px;padding:5px 6px;border:1px solid var(--rule2);border-radius:5px;background:var(--sheet)}
.crow input{font-family:var(--f-num);text-align:right}
.crow .fnsel{grid-column:1/-2}
.crow .x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:15px;line-height:1;padding:4px}
.crow .x:hover{color:var(--bad)}
.chead{display:grid;grid-template-columns:minmax(0,1fr) 78px 78px 26px;gap:5px;font:500 11px var(--f-num);color:var(--muted)}
.chead span:nth-child(2),.chead span:nth-child(3){text-align:right}
.ctot{display:grid;grid-template-columns:minmax(0,1fr) 78px 78px 26px;gap:5px;font:600 12px var(--f-num);border-top:1px solid var(--rule2);padding-top:4px}
.ctot span{text-align:right}
.ctot span:first-child{text-align:left;font-family:var(--f-ui)}

.txl{list-style:none;margin:0;padding:4px 8px 14px}
.tx{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:1px 8px;align-items:baseline;padding:6px 8px;border-radius:6px;cursor:pointer}
.tx:hover{background:var(--sheet2)}
.tx.on{background:var(--hl)}
.tx.editing{outline:2px solid var(--accent);outline-offset:-2px}
.tx .no{font:600 11.5px var(--f-num);color:var(--accent)}
.tx .memo{font-size:13px;line-height:1.35;overflow-wrap:anywhere}
.tx .amt{font:12px var(--f-num);text-align:right;white-space:nowrap}
.tx .meta{grid-column:2/4;display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;font-size:11.5px;color:var(--muted)}
.tx .meta .d{font-family:var(--f-num)}
.tag{font-size:10.5px;line-height:1.5;border:1px solid var(--rule2);border-radius:4px;padding:0 5px;color:var(--ink2);background:var(--sheet)}
.tag.adj{border-color:var(--accent);color:var(--accent)}
.tag.oci,.tag.disc{border-style:dashed}
.tx .acts{margin-left:auto;display:flex;gap:2px}
.tx .acts button{border:0;background:none;color:var(--muted);font-size:11.5px;cursor:pointer;padding:1px 6px;border-radius:4px}
.tx .acts button:hover{color:var(--ink);background:var(--sheet)}
.empty{color:var(--muted);font-size:13px;padding:10px 8px}

/* ---------- board ---------- */
.tabs{display:flex;overflow-x:auto;border-bottom:1px solid var(--rule);padding-inline:8px;scrollbar-width:thin}
.tabs button{flex:0 0 auto;display:flex;align-items:baseline;gap:6px;border:0;background:none;padding:12px 10px 10px;border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;color:var(--muted);font-size:13.5px}
.tabs button:hover{color:var(--ink)}
.tabs button .n{font:500 11px var(--f-num)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tabs button[aria-selected="true"] .n{color:var(--accent)}
.fp{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;background:var(--hl);padding:7px 16px;font-size:12.5px}
.fp b{font-weight:600}
.pane{padding:16px 18px 30px}
.pane-bar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-start;justify-content:space-between;margin-bottom:14px}
.tip{font-size:13px;color:var(--ink2);max-width:70ch;margin:0}
.pane-ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.score{font:500 12px var(--f-num);color:var(--ink2)}

/* statements */
.paper{background:var(--sheet);border:1px solid var(--rule);border-radius:4px;padding:26px clamp(12px,3vw,34px) 22px;max-width:800px;margin:0 auto 18px}
.st-head{text-align:center;margin-bottom:14px}
.st-co{font:600 17px/1.3 var(--f-doc)}
.st-head h3{margin:3px 0 2px;font:600 15.5px/1.35 var(--f-doc)}
.st-head .zh{display:block;font:400 12.5px/1.4 var(--f-ui);color:var(--muted)}
.st-per{font:italic 13px/1.4 var(--f-doc);color:var(--ink2)}
.st-per .zh{font-style:normal}
.scroll{overflow-x:auto}
table.st{width:100%;border-collapse:collapse;font:14px/1.4 var(--f-doc);font-variant-numeric:tabular-nums lining-nums}
.st th{font:500 11.5px var(--f-num);color:var(--muted);text-align:right;padding:4px 4px 6px;border-bottom:1px solid var(--rule);white-space:nowrap}
.st td{padding:3.5px 4px;vertical-align:bottom}
.st td.lab{padding-right:14px;min-width:200px}
.st td.amt{text-align:right;white-space:nowrap;width:118px;min-width:92px}
.st td.prior{color:var(--ink2)}
.st .lab .zh,.wk .zh,.jt .zh,.tacc .zh{font:12px var(--f-ui);color:var(--muted);margin-left:6px}
.lang-zh .st .lab .zh{margin-left:0}
.ind1{padding-left:22px!important}.ind2{padding-left:40px!important}
.r-h td.lab{font-weight:600;padding-top:12px}
.r-s td.lab{font-weight:600}
.r-g td.lab{font-weight:700}
.r-g td{padding-top:6px}
tr.ul td.has{border-bottom:1px solid var(--ink2)}
tr.r-g td.has{border-bottom:3px double var(--ink)}
tr.tr{cursor:pointer}
tr.tr:hover td{background:var(--sheet2)}
tr.hit td{background:var(--hl)!important}
.rp.ghost{visibility:hidden}
.st-notes{font:13px/1.6 var(--f-ui);color:var(--ink2);margin:16px 0 0;padding-top:12px;border-top:1px dashed var(--rule2);display:flex;flex-direction:column;gap:6px}
.st-notes p{margin:0}
.st-notes b{color:var(--ink)}
.guess{width:100%;max-width:112px;text-align:right;font:13px var(--f-num);padding:1px 4px;border:1px dashed var(--rule2);border-radius:3px;background:var(--sheet2)}
.guess.right{border:1px solid var(--ok);background:var(--ok-soft)}
.guess.wrong{border:1px solid var(--bad);background:var(--bad-soft)}
.ans{display:block;font:11px var(--f-num);color:var(--bad)}
.soce td.amt{width:auto;min-width:96px}
.soce th{white-space:normal;vertical-align:bottom;min-width:96px}
.soce th .zh{display:block;font:11px var(--f-ui)}

/* journal */
.jlegend{display:grid;grid-template-columns:minmax(0,1fr) 48px 110px 110px;font:500 11px var(--f-num);color:var(--muted);border-bottom:1px solid var(--rule2);padding:0 4px 5px;gap:0 4px}
.jlegend span:nth-child(3),.jlegend span:nth-child(4){text-align:right}
.je{border-top:1px solid var(--rule);padding:10px 4px 10px;border-radius:0;scroll-margin-top:80px}
.je:first-of-type{border-top:0}
.je.hit{background:var(--hl);border-radius:6px;border-top-color:transparent}
.je-h{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;margin-bottom:4px}
.je-no{font:600 12px var(--f-num);color:var(--accent)}
.je-date{font:12px var(--f-num);color:var(--muted)}
.je-memo{font-size:13.5px;font-weight:500}
table.jt{width:100%;border-collapse:collapse;font-size:13.5px}
.jt td{padding:2px 4px;vertical-align:baseline}
.jt td.ref{font:11.5px var(--f-num);color:var(--muted);width:48px}
.jt td.amt{font:13px var(--f-num);text-align:right;width:110px;white-space:nowrap}
.jt td.cra{padding-left:36px}
.jt tr.gs td{height:8px}
.fn{font-size:10.5px;border:1px solid var(--rule2);border-radius:3px;padding:0 4px;color:var(--muted);margin-left:6px;white-space:nowrap}
.dr-amt,.dr{color:var(--dr)}
.cr-amt,.cr{color:var(--cr)}
details.why{margin-top:6px;font-size:12.5px;color:var(--ink2)}
details.why summary{cursor:pointer;color:var(--accent);font-weight:500;width:max-content;max-width:100%}
.why-b{display:flex;flex-direction:column;gap:6px;padding:6px 0 2px}
.why-b ul{margin:0;padding-left:18px}
.why-b li{margin:2px 0}
.eqline{font:12px var(--f-num);background:var(--sheet2);border:1px solid var(--rule);border-radius:5px;padding:4px 8px;width:max-content;max-width:100%;overflow-wrap:anywhere}
.veil{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12.5px;color:var(--ink2);background:var(--sheet2);border:1px dashed var(--rule2);border-radius:6px;padding:8px 10px}

/* ledger */
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tacc{border:1px solid var(--rule);border-radius:6px;padding:10px 12px 8px;background:var(--sheet)}
.tacc.hit{border-color:var(--ink2);box-shadow:0 0 0 2px var(--hl)}
.tacc h4{margin:0;text-align:center;font:600 13px/1.3 var(--f-ui)}
.tacc h4 .code{font:500 11px var(--f-num);color:var(--muted);margin-right:5px}
.tacc .en2{display:block;text-align:center;font-size:11px;color:var(--muted);margin:1px 0 6px}
.tsides{display:grid;grid-template-columns:1fr 1fr;border-top:2px solid var(--ink)}
.tside{padding:4px 6px 2px;min-height:34px;min-width:0}
.tside:first-child{border-right:2px solid var(--ink)}
.trow{display:flex;justify-content:space-between;gap:6px;font:12px/1.65 var(--f-num);border-radius:3px;padding:0 2px}
.trow .r{color:var(--muted);border:0;background:none;padding:0;cursor:pointer;font:inherit;text-decoration:underline dotted;text-underline-offset:2px}
.trow .r.ob{cursor:default;text-decoration:none}
.trow.hit{background:var(--hl)}
.tfoot{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--rule2);font:600 12px/1.8 var(--f-num)}
.tfoot div{display:flex;justify-content:space-between;gap:6px;padding:0 8px}
.tfoot div:first-child{border-right:2px solid var(--ink)}
.tfoot .lbl{color:var(--muted);font-weight:500}

/* worksheet */
table.wk{border-collapse:collapse;width:100%;font:12.5px var(--f-num);min-width:760px}
.wk th{font:600 11.5px/1.35 var(--f-ui);color:var(--ink2);padding:6px 8px;border-bottom:1px solid var(--rule2);text-align:right;vertical-align:bottom}
.wk th.a{text-align:left}
.wk thead tr:first-child th{text-align:center;border-bottom:1px solid var(--rule)}
.wk td{padding:4px 8px;border-bottom:1px solid var(--rule);text-align:right;white-space:nowrap}
.wk td.a{text-align:left;font-family:var(--f-ui);white-space:normal}
.wk td.a .c{font:11px var(--f-num);color:var(--muted);margin-right:6px}
.wk .gl{border-left:1px solid var(--rule2)}
.wk tfoot td{font-weight:600;border-top:2px solid var(--ink);border-bottom:3px double var(--ink)}
.wk tr.hit td{background:var(--hl)}
.wk td.adjc{color:var(--accent)}
.okbad{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;padding:3px 10px;border-radius:999px;background:var(--ok-soft);color:var(--ok)}
.okbad.bad{background:var(--bad-soft);color:var(--bad)}
.subh{font:600 14px var(--f-ui);margin:22px 0 8px}

<script>
// Keep the original sample.json contract while model authorization stays on the server.
window.AccountingAI = (() => {
  const key = 'acct2102-ai-connection';
  let config = {base:'', token:''};
  try { config = {...config, ...JSON.parse(sessionStorage.getItem(key) || '{}')}; } catch (e) {}
  let status = {configured:false, message:'正在检查 AI 连接…'};
  const headers = () => ({'Content-Type':'application/json', 'X-Accounting-AI':'1', ...(config.token ? {Authorization:'Bearer ' + config.token} : {})});
  const failure = (code, message) => Object.assign(new Error(message), {code});
  async function request(path, options = {}) {
    if (location.protocol === 'file:' && !config.base) throw failure('offline', '请通过云端服务打开本页，或在「AI 连接」中填写服务地址。');
    try {
      const response = await fetch(config.base + '/api/ai/' + path, {...options, headers:headers()});
      let body;
      try { body = await response.json(); } catch (e) { throw failure('offline', '当前地址没有可用的 AI 服务，请检查「AI 连接」。'); }
      if (!response.ok) throw failure(body.error?.code || 'upstream_error', body.error?.message || 'AI 服务暂时不可用。');
      return body;
    } catch (e) {
      if (options.signal?.aborted) throw failure('cancelled', '已停止请求。');
      if (e.code) throw e;
      throw failure('offline', '无法连接 AI 服务，请检查云端服务和连接地址。');
    }
  }
  return {
    get status(){ return status; },
    get base(){ return config.base; },
    get token(){ return config.token; },
    save(base, token){
      base = base.trim().replace(/\/+$/, '');
      if (base) {
        const url = new URL(base);
        if (!['http:', 'https:'].includes(url.protocol) || url.username || url.password || url.search || url.hash || url.pathname !== '/') throw failure('invalid_request', '服务地址应是完整的 HTTP/HTTPS 地址，不包含路径、口令或查询参数。');
        if (url.protocol === 'http:' && !['localhost','127.0.0.1','[::1]'].includes(url.hostname)) throw failure('invalid_request', '远程 AI 服务地址需要使用 HTTPS。');
        base = url.origin;
      }
      config = {base, token:token.trim()};
      try { sessionStorage.setItem(key, JSON.stringify(config)); } catch (e) {}
    },
    async refresh(){
      try { status = await request('status', {signal:AbortSignal.timeout(6000)}); }
      catch (e) { status = {configured:false, message:e.code === 'cancelled' ? '检查连接超时，请稍后刷新。' : e.message}; }
      return status;
    },
    loginStatus(){ return request('login', {signal:AbortSignal.timeout(6000)}); },
    startLogin(){ return request('login', {method:'POST', body:'{}', signal:AbortSignal.timeout(25000)}); },
    cancelLogin(id){ return request('login/cancel', {method:'POST', body:JSON.stringify({id}), signal:AbortSignal.timeout(6000)}); },
    async json(prompt, {signal, task = 'transaction'} = {}) {
      const body = await request('json', {method:'POST', signal, body:JSON.stringify({prompt, task})});
      if (!body.result || typeof body.result !== 'object' || Array.isArray(body.result)) throw failure('invalid_json', 'AI 返回的内容无法识别，请再试一次。');
      return body.result;
    },
  };
})();
</script>

/* ================= numbers ================= */
function money(v){
  if (v == null) return NaN;
  let s = String(v).trim(); if (!s) return NaN;
  let neg = false;
  if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
  s = s.replace(/HK\$/gi, '').replace(/[,\s$]/g, '');
  if (s.startsWith('-')) { neg = !neg; s = s.slice(1); }
  if (!/^(\d+\.?\d*|\.\d+)$/.test(s)) return NaN;
  const c = Math.round(parseFloat(s) * 100);
  return neg ? -c : c;
}
const num = v => { const n = parseFloat(String(v ?? '').replace(/[,\s]/g, '')); return Number.isFinite(n) ? n : NaN; };
const pos = v => Number.isFinite(v) && v > 0;
function fmt(c){
  if (c == null || !Number.isFinite(c)) return '';
  const neg = c < 0, a = Math.abs(Math.round(c)), d = a % 100 !== 0;
  const s = (a / 100).toLocaleString('en-US', {minimumFractionDigits: d ? 2 : 0, maximumFractionDigits: 2});
  return neg ? `(${s})` : s;
}
let CUR_OVR = null;
const cur = () => CUR_OVR || (typeof S !== 'undefined' && S && S.company && S.company.cur) || 'HK$';
const m$ = c => `${cur()}${fmt(c)}`;
function amtHTML(c){
  if (c == null) return '';
  if (c === 0) return '–<span class="rp ghost">)</span>';
  const neg = c < 0;
  return `${neg ? '(' : ''}${fmt(Math.abs(c))}<span class="rp${neg ? '' : ' ghost'}">)</span>`;
}
function epsHTML(v){
  if (v == null || !isFinite(v)) return '';
  const neg = v < -0.0000001;
  return `${neg ? '(' : ''}${Math.abs(v).toFixed(2)}<span class="rp${neg ? '' : ' ghost'}">)</span>`;
}
function allocate(total, w){
  const W = w.reduce((a, b) => a + b, 0); if (!W) return w.map(() => 0);
  const raw = w.map(x => total * x / W), fl = raw.map(Math.floor);
  let rem = total - fl.reduce((a, b) => a + b, 0);
  const order = raw.map((x, i) => [x - fl[i], i]).sort((a, b) => b[0] - a[0]);
  for (let k = 0; k < rem; k++) fl[order[k % order.length][1]]++;
  return fl;
}
function monthsOut(date){
  const [y, m, d] = date.split('-').map(Number);
  const dim = new Date(y, m, 0).getDate();
  return 12 - (m - 1) - (d - 1) / dim;
}
const fmtMo = m => (Math.round(m * 100) / 100).toString();

function balancesOf(s, excludeId){
  const b = {...s.opening};
  for (const t of s.txns) { if (t.id === excludeId) continue; for (const g of t.groups) for (const l of g) b[l.a] = (b[l.a] || 0) + l.s; }
  return b;
}
function runTpl(s, id, p, excludeId){
  const t = TPL[id]; if (!t) return {err:'未知的交易类型'};
  const b = balancesOf(s, excludeId);
  const ctx = {bal: a => b[a] || 0, year: s.company.year};
  let r;
  try { r = t.build(p, ctx) || {err:'无法生成分录'}; } catch (e) { r = {err:'输入有误：' + e.message}; }
  if (r.err) return r;
  r.groups = r.groups.map(g => g.filter(l => l.s).map(l => { const fn = normFn(l.a, l.fn); return fn ? {a:l.a, s:Math.round(l.s), fn} : {a:l.a, s:Math.round(l.s)}; })).filter(g => g.length);
  if (!r.groups.length) return {err:'金额为零，不需要记账'};
  for (const g of r.groups) if (g.reduce((x, l) => x + l.s, 0) !== 0) return {err:'分录借贷不平衡'};
  return r;
}
function buildState(def){
  const s = blankState();
  s.company = {name:def.name, year:2026, cur:def.cur || 'HK$'};
  s.openingShares = def.shares || 0;
  for (const k in def.ob) s.opening[k] = def.ob[k] * 100;
  CUR_OVR = s.company.cur;
  try {
    for (const [date, id, p] of def.tx) {
      const r = runTpl(s, id, p, null);
      if (r.err) { console.warn(id, r.err); continue; }
      const t = TPL[id]; s.seq++;
      s.txns.push({id:'T' + s.seq, seq:s.seq, date, tpl:id, p:{...p}, memoUser:'', memo:t.memo(p), adj:isAdjTpl(t), groups:r.groups, calc:r.calc || '', shares:r.shares || 0});
    }
  } finally { CUR_OVR = null; }
  return s;
}

function normalize(s){
  const b = blankState();
  const out = {...b, ...s, company:{...b.company, ...(s.company || {})}, settings:{...b.settings, ...(s.settings || {})}};
  out.opening = s.opening && typeof s.opening === 'object' ? s.opening : {};
  out.txns = (Array.isArray(s.txns) ? s.txns : []).filter(t => t && Array.isArray(t.groups) && t.date && t.groups.every(g => Array.isArray(g) && g.every(l => ACC[l.a] && Number.isFinite(l.s))));
  out.seq = Math.max(out.seq || 0, ...out.txns.map(t => t.seq || 0), 0);
  out.txns.forEach((t, i) => { if (!t.id) t.id = 'T' + (++out.seq); if (!t.seq) t.seq = ++out.seq; });
  return out;
}

  let pbt = 0, disc = 0;
  for (const e of entries) for (const g of e.groups) for (const l of g) {
    const p = ACC[l.a].pl;
    if (p === 'rev' || p === 'oth' || p === 'opx') pbt -= l.s; else if (p === 'disc') disc -= l.s;
  }
  const t1 = Math.round(pbt * rate), t2 = Math.round(disc * rate);
  if (!t1 && !t2) return null;
  const g = [];
  if (t1) g.push({a:'8000', s:t1});
  if (t2) g.push({a:'8510', s:t2});
  if (t1 + t2) g.push({a:'2200', s:-(t1 + t2)});
  const pct = S.settings.tax;
  return {id:'TAX', auto:true, adj:true, date:`${S.company.year}-12-31`, seq:1e9,
    memo:`计提本年所得税（税率 ${pct}%，系统自动）`, groups:[g],
    calc:`持续经营税前利润 ${m$(pbt)} × ${pct}% = ${m$(t1)}${disc?`；终止经营税前损益 ${fmt(disc)} × ${pct}% = ${fmt(t2)}（${t2<0?'所得税利益':'所得税费用'}）`:''}`,
    note:'「期间内所得税分配」：持续经营的税列为所得税费用；终止经营的税并入终止经营，最终以税后单一金额列报。可在「设置」里关闭自动计提。'};
}

function compute(){
  const yr = +S.company.year;
  const txs = [...S.txns].sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : a.seq - b.seq);
  const entries = txs.map(t => ({...t}));
  const taxE = S.settings.autoTax ? taxEntry(entries) : null;
  if (taxE) entries.push(taxE);
  entries.forEach((e, i) => e.no = i + 1);
  const byId = {}; entries.forEach(e => byId[e.id] = e);
  const POST = [];
  entries.forEach(e => e.groups.forEach((g, gi) => g.forEach(l => POST.push({id:e.id, g:gi, a:l.a, s:l.s, fn:l.fn || null, adj:!!e.adj}))));
  const OB = S.opening, MV = {};
  POST.forEach(p => { MV[p.a] = (MV[p.a] || 0) + p.s; });
  const bal = a => (OB[a] || 0) + (MV[a] || 0);
  const col = (pred, sign = 1) => { let amt = 0; const ids = new Map(); for (const p of POST) if (pred(p)) { const v = p.s * sign; amt += v; ids.set(p.id, (ids.get(p.id) || 0) + v); } return {amt, ids}; };
  const acol = (c, sign) => col(p => p.a === c, sign);
  const X = {yr, entries, byId, POST, OB, MV, bal, col, acol, taxE};

  // ---- profit or loss
  const P = {};
  const fnOf = p => p.fn || ACC[p.a].fn || 'other';
  P.rev = COA.filter(a => a.pl === 'rev').map(a => ({a, ...acol(a.c, -1)}));
  P.revTot = P.rev.reduce((x, y) => x + y.amt, 0);
  for (const f of ['cos', 'sell', 'admin', 'other']) P[f] = col(p => ACC[p.a].pl === 'opx' && fnOf(p) === f, 1);
  P.opx = COA.filter(a => a.pl === 'opx').map(a => ({a, ...acol(a.c, 1)}));
  P.opxTot = P.sell.amt + P.admin.amt + P.other.amt;
  P.gp = P.revTot - P.cos.amt;
  P.opProfit = P.gp - P.opxTot;
  P.oth = COA.filter(a => a.pl === 'oth').map(a => ({a, ...acol(a.c, -1)}));
  P.othTot = P.oth.reduce((x, y) => x + y.amt, 0);
  P.pbt = P.opProfit + P.othTot;
  P.tax = acol('8000', 1);
  P.cont = P.pbt - P.tax.amt;
  P.disc = acol('8500', -1); P.discTax = acol('8510', -1);
  P.discNet = P.disc.amt + P.discTax.amt;
  P.hasDisc = P.disc.ids.size > 0 || P.discTax.ids.size > 0;
  P.np = P.cont + P.discNet;
  P.oci = COA.filter(a => a.t === 'O').map(a => ({a, ...acol(a.c, -1)}));
  P.ociOf = c => P.oci.find(x => x.a.c === c);
  P.ociTot = P.oci.reduce((x, y) => x + y.amt, 0);
  P.tci = P.np + P.ociTot;
  P.plHits = new Set(POST.filter(p => ACC[p.a].pl).map(p => p.id));
  P.ociHits = new Set(POST.filter(p => ACC[p.a].t === 'O').map(p => p.id));
  // EPS
  let w = +S.openingShares || 0;
  const parts = [`期初 ${w.toLocaleString('en-US')} 股 × 12/12`];
  for (const t of S.txns) if (t.shares > 0 && String(t.date).slice(0, 4) === String(yr)) {
    const mo = monthsOut(t.date); w += t.shares * mo / 12;
    parts.push(`${t.date.slice(5)} 发行 ${t.shares.toLocaleString('en-US')} 股 × ${fmtMo(mo)}/12`);
  }
  P.wSh = w; P.wParts = parts;
  P.eps = v => w > 0 ? v / 100 / w : null;
  X.P = P;

  // ---- financial position
  const assetCodes = COA.filter(a => a.t === 'A' || a.t === 'XA').map(a => a.c);
  const liabCodes = COA.filter(a => a.t === 'L').map(a => a.c);
  const sumB = cs => cs.reduce((x, c) => x + bal(c), 0);
  const sumO = cs => cs.reduce((x, c) => x + (OB[c] || 0), 0);
  X.totA = sumB(assetCodes); X.totL = -sumB(liabCodes);
  X.scEnd = -bal('3000');
  X.reEnd = -(bal('3100') + bal('3300')) + P.np;
  X.revalEnd = -bal('3200') + P.ociOf('9000').amt;
  X.fvrEnd = -bal('3210') + P.ociOf('9100').amt;
  X.totE = X.scEnd + X.reEnd + X.revalEnd + X.fvrEnd;
  X.oA = sumO(assetCodes); X.oL = -sumO(liabCodes); X.oE = -sumO(['3000', '3100', '3200', '3210', '3300']);
  let obDr = 0, obCr = 0; for (const k in OB) { if (!ACC[k]) continue; if (OB[k] > 0) obDr += OB[k]; else obCr -= OB[k]; }
  X.obDr = obDr; X.obCr = obCr;
  let tbDr = 0, tbCr = 0; for (const a of COA) { const b = bal(a.c); if (b > 0) tbDr += b; else tbCr -= b; }
  X.tbDr = tbDr; X.tbCr = tbCr;

  X.CF = computeCF(X);
  X.CL = computeClosing(X);
  X.checks = [
    {k:'ob', ok: obDr === obCr, zh:'期初平衡', why:`期初余额：借方合计 ${m$(obDr)}，贷方合计 ${m$(obCr)}。${obDr===obCr?'两者相等。':'两者不等，请在「期初余额」页修正，否则财务状况表不会平衡。'}`},
    {k:'tb', ok: tbDr === tbCr, zh:'试算平衡', why:`调整后试算平衡表：借方 ${m$(tbDr)}，贷方 ${m$(tbCr)}。每笔分录借贷相等，所以只要期初平衡，试算表一定平衡。`},
    {k:'eq', ok: X.totA === X.totL + X.totE, zh:'资产 = 负债 + 权益', why:`资产 ${m$(X.totA)} = 负债 ${m$(X.totL)} + 权益 ${m$(X.totE)}。`},
    {k:'np', ok: true, zh:'净利润 → 留存收益', why:`损益表的净利润 ${m$(P.np)} 进入权益变动表的留存收益栏：期初 ${m$(-(OB['3100']||0))} + 净利润 ${m$(P.np)} − 股利 ${m$(bal('3300'))} + 其他 ${m$(-(MV['3100']||0))} = 期末 ${m$(X.reEnd)}，再列入财务状况表。`},
    {k:'cash', ok: X.CF.closeCash === bal('1000') && X.CF.openCash + X.CF.net === X.CF.closeCash, zh:'现金对得上', why:`现金流量表：期初现金 ${m$(X.CF.openCash)} + 现金净增加 ${m$(X.CF.net)} = 期末现金 ${m$(X.CF.openCash + X.CF.net)}；财务状况表的现金 ${m$(bal('1000'))}。`},
    {k:'cfm', ok: X.CF.opTot === X.CF.indirectTot, zh:'间接法 = 直接法', why:`经营活动现金流量：直接法 ${m$(X.CF.opTot)}，间接法 ${m$(X.CF.indirectTot)}。两种方法只是呈现方式不同，结果必须相同。`},
  ];
  return X;
}

function computeCF(X){
  const items = [], adjs = [], nonCash = [];
  for (const e of X.entries) e.groups.forEach(g => {
    let invfin = 0;
    const cashL = g.filter(l => ACC[l.a].cf === 'cash');
    for (const cl of cashL) {
      const s = cl.s; if (!s) continue;
      const opp = g.filter(l => ACC[l.a].cf !== 'cash' && Math.sign(l.s) === -Math.sign(s));
      const nc = opp.filter(l => ACC[l.a].cf === 'inv' || ACC[l.a].cf === 'fin');
      const pool = nc.length ? nc : opp;
      if (!pool.length) continue;
      const parts = allocate(Math.abs(s), pool.map(l => Math.abs(l.s)));
      pool.forEach((l, i) => {
        const amt = Math.sign(s) * parts[i]; if (!amt) return;
        const A = ACC[l.a];
        if (A.cf === 'inv' || A.cf === 'fin') { items.push({id:e.id, cat:A.cf, key:A.k + ':' + (amt > 0 ? 'in' : 'out'), amt}); invfin += amt; }
        else items.push({id:e.id, cat:'op', key:A.op || 'otherOpex', amt});
      });
    }
    let sNC = 0, sOCI = 0;
    for (const l of g) { const cf = ACC[l.a].cf; if (cf === 'inv' || cf === 'fin') sNC += l.s; else if (cf === 'oci') sOCI += l.s; }
    const adj = -invfin - sNC - sOCI;
    if (adj) {
      const pls = g.filter(l => ACC[l.a].pl && ACC[l.a].adj).sort((a, b) => Math.abs(b.s) - Math.abs(a.s));
      adjs.push({id:e.id, key: pls.length ? ACC[pls[0].a].adj : 'other', amt:adj});
    }
    if (!cashL.length && !g.some(l => ['pl', 'oci', 'wc'].includes(ACC[l.a].cf))) {
      const cats = new Set(g.map(l => ACC[l.a].cf)), keys = new Set(g.map(l => ACC[l.a].k));
      if (!keys.has('div') && ((cats.has('inv') && cats.has('fin')) || (cats.size === 1 && cats.has('fin') && keys.size > 1)))
        nonCash.push({id:e.id, amt:g.filter(l => l.s > 0).reduce((x, l) => x + l.s, 0)});
    }
  });
  const agg = (list, order) => {
    const m = new Map();
    for (const it of list) { if (!m.has(it.key)) m.set(it.key, {key:it.key, amt:0, ids:new Map()}); const o = m.get(it.key); o.amt += it.amt; o.ids.set(it.id, (o.ids.get(it.id) || 0) + it.amt); }
    const arr = [...m.values()];
    arr.sort((a, b) => { const ia = order.indexOf(a.key), ib = order.indexOf(b.key); return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib); });
    return arr;
  };
  const opD = agg(items.filter(i => i.cat === 'op'), OP_ORDER);
  const inv = agg(items.filter(i => i.cat === 'inv'), INV_ORDER);
  const fin = agg(items.filter(i => i.cat === 'fin'), FIN_ORDER);
  const adjAgg = agg(adjs, ['dep', 'reval', 'ppe', 'disc', 'other']);
  // working capital
  const groups = {};
  COA.filter(a => a.cf === 'wc').forEach(a => (groups[a.wc] = groups[a.wc] || []).push(a.c));
  const wc = [];
  for (const [k, codes] of Object.entries(groups)) {
    const open = codes.reduce((x, c) => x + (X.OB[c] || 0), 0), close = codes.reduce((x, c) => x + X.bal(c), 0);
    const ids = new Map();
    for (const p of X.POST) if (codes.includes(p.a)) ids.set(p.id, (ids.get(p.id) || 0) - p.s);
    if (open === close) continue;
    wc.push({k, codes, open, close, amt:-(close - open), ids, isAsset: ACC[codes[0]].t === 'A'});
  }
  const sum = a => a.reduce((x, y) => x + y.amt, 0);
  const opTot = sum(opD), invTot = sum(inv), finTot = sum(fin);
  const indirectTot = X.P.np + sum(adjAgg) + sum(wc);
  const pick = k => -(opD.find(x => x.key === k)?.amt || 0);
  return {items, opD, inv, fin, adjAgg, wc, nonCash, nonCashIds:new Set(nonCash.map(n => n.id)), opTot, invTot, finTot, indirectTot,
    net: opTot + invTot + finTot, openCash: X.OB['1000'] || 0, closeCash: X.bal('1000'), intPaid: pick('intPaid'), taxPaid: pick('tax'), intRec: -pick('intRec')};
}

function computeClosing(X){
  const plA = COA.filter(a => a.pl), E = [];
  const crb = plA.filter(a => X.bal(a.c) < 0), drb = plA.filter(a => X.bal(a.c) > 0);
  if (crb.length) { const tot = crb.reduce((x, a) => x - X.bal(a.c), 0); E.push({id:'C1', no:'C1', memo:'结转贷方余额的收入、利得类账户 → 本年利润汇总', groups:[[...crb.map(a => ({a:a.c, s:-X.bal(a.c)})), {a:'3900', s:-tot}]]}); }
  if (drb.length) { const tot = drb.reduce((x, a) => x + X.bal(a.c), 0); E.push({id:'C2', no:'C2', memo:'结转借方余额的费用、损失类账户 → 本年利润汇总', groups:[[{a:'3900', s:tot}, ...drb.map(a => ({a:a.c, s:-X.bal(a.c)}))]]}); }
  const np = X.P.np;
  if (np) E.push({id:'C3', no:'C3', memo: np > 0 ? '本年利润汇总的贷方余额（净利润）→ 留存收益' : '本年利润汇总的借方余额（净亏损）→ 留存收益', groups:[np > 0 ? [{a:'3900', s:np}, {a:'3100', s:-np}] : [{a:'3100', s:-np}, {a:'3900', s:np}]]});
  const dv = X.bal('3300');
  if (dv) E.push({id:'C4', no:'C4', memo:'结转股利账户 → 留存收益（股利不经过本年利润汇总）', groups:[[{a:'3100', s:dv}, {a:'3300', s:-dv}]]});
  const oc = [];
  for (const a of COA.filter(a => a.t === 'O')) { const b = X.bal(a.c); if (b) oc.push({a:a.c, s:-b}, {a:a.res, s:b}); }
  if (oc.length) E.push({id:'C5', no:'C5', memo:'结转 OCI → 权益中的储备（累计其他综合收益）', groups:[oc]});
  const pc = {};
  for (const a of COA) pc[a.c] = X.bal(a.c);
  for (const e of E) for (const g of e.groups) for (const l of g) pc[l.a] = (pc[l.a] || 0) + l.s;
  return {E, pc};
}

/* ================= labels ================= */
const lang = () => S.settings.lang;
function lab(en, zh){
  const l = lang();
  if (l === 'en') return `<span class="en">${esc(en)}</span>`;
  if (l === 'zh') return `<span class="en">${esc(zh)}</span>`;
  return `<span class="en">${esc(en)}</span><span class="zh">${esc(zh)}</span>`;
}
const acctLab = a => lab(ACC[a].en, ACC[a].zh);
const acctZh = a => ACC[a].zh;

/* ================= trace objects ================= */
function T(ids, why, o = {}){
  const hits = new Set();
  if (ids) for (const [k, v] of ids) if (v !== 0 && k !== 'OB' && k !== 'NP') hits.add(k);
  if (o.hits) for (const k of o.hits) hits.add(k);
  return {...o, ids, why, hits};
}
function Tsum(why, ...trs){
  const hits = new Set();
  trs.forEach(t => t && t.hits && t.hits.forEach(k => hits.add(k)));
  return {ids:null, why, hits};
}
const withOB = (ids, ob) => { const m = new Map(); if (ob) m.set('OB', ob); for (const [k, v] of ids) m.set(k, v); return m; };

/* ================= statement row builder ================= */
function RB(){
  const rows = [];
  const last = () => { for (let i = rows.length - 1; i >= 0; i--) { const r = rows[i]; if (r.k === 'l' || r.k === 's' || r.k === 'g') return r; if (r.k === 'h') return null; } return null; };
  return {rows,
    h(en, zh, ind = 0){ rows.push({k:'h', en, zh, ind}); },
    l(en, zh, v, tr, col = 'out', ind = 1, o = {}){ rows.push({k:'l', en, zh, v, tr, col, ind, ...o}); },
    s(en, zh, v, tr, col = 'out', ind = 0, o = {}){ const p = last(); if (p) p.ul = true; rows.push({k:'s', en, zh, v, tr, col, ind, ...o}); },
    g(en, zh, v, tr, col = 'out', o = {}){ const p = last(); if (p) p.ul = true; rows.push({k:'g', en, zh, v, tr, col, ind:0, ...o}); },
    sp(){ rows.push({k:'sp'}); },
  };
}
const nz = x => x && (x.amt !== 0 || (x.ids && x.ids.size > 0));
const acctWhy = (a, what = '本期发生额') => `${ACC[a].zh}（${ACC[a].c}）${what}合计。下面是构成这个数字的每一笔分录。`;

/* ---------- P&L ---------- */
function plRows(part){
  const P = R.P, b = RB(), method = S.settings.plMethod;
  const trNP = T(null, '', {hits:P.plHits});
  const trNPw = Tsum(`净利润 = 持续经营利润 ${m$(P.cont)}${P.hasDisc ? ` + 终止经营税后损益 ${m$(P.discNet)}` : ''} = ${m$(P.np)}`, trNP);
  if (part !== 'oci') {
    let trRev, trPBT;
    if (method === 'function') {
      const revs = P.rev.filter(nz);
      if (revs.length <= 1) {
        const x = revs[0] || P.rev[0];
        trRev = T(x.ids, acctWhy(x.a.c, '贷方发生额'));
        b.l(x.a.en, x.a.zh, x.amt, trRev, 'out', 0);
      } else {
        const trs = revs.map(x => T(x.ids, acctWhy(x.a.c, '贷方发生额')));
        revs.forEach((x, i) => b.l(x.a.en, x.a.zh, x.amt, trs[i], 'in', 1));
        trRev = Tsum(`营业收入 = ${revs.map(x => `${x.a.zh} ${m$(x.amt)}`).join(' + ')} = ${m$(P.revTot)}`, ...trs);
        b.s('Revenue', '营业收入合计', P.revTot, trRev, 'out', 0);
      }
      const trCos = T(P.cos.ids, '按功能归入「销售成本」的所有费用分录（主要是结转的商品成本）。');
      b.l('Cost of sales', '销售成本', P.cos.amt, trCos, 'out', 0);
      const trGP = Tsum(`毛利 = 营业收入 ${m$(P.revTot)} − 销售成本 ${m$(P.cos.amt)} = ${m$(P.gp)}`, trRev, trCos);
      b.s('Gross profit', '毛利', P.gp, trGP, 'out', 0);
      b.h('Operating expenses:', '营业费用：');
      const fx = ['sell', 'admin', 'other'].filter(f => nz(P[f]));
      const fts = fx.map(f => T(P[f].ids, `按功能归入「${FN_LABEL[f][1]}」的所有费用分录。同一个费用账户（例如工资、折旧）可以按部门分别归入不同功能。`));
      fx.forEach((f, i) => b.l(FN_LABEL[f][0], FN_LABEL[f][1], P[f].amt, fts[i], 'in', 1));
      const trOpx = Tsum(`营业费用合计 = ${fx.map(f => `${FN_LABEL[f][1]} ${m$(P[f].amt)}`).join(' + ') || '0'} = ${m$(P.opxTot)}`, ...fts);
      b.s('Total operating expenses', '营业费用合计', P.opxTot, trOpx, 'out', 1);
      const trOP = Tsum(`营业利润 = 毛利 ${m$(P.gp)} − 营业费用 ${m$(P.opxTot)} = ${m$(P.opProfit)}`, trGP, trOpx);
      b.s('Operating profit', '营业利润', P.opProfit, trOP, 'out', 0);
      const oth = P.oth.filter(nz);
      let trOth = null;
      if (oth.length) {
        b.h('Other income (expense):', '其他收益（费用）：');
        const ots = oth.map(x => T(x.ids, acctWhy(x.a.c) + '（收益为正，费用在括号内）'));
        oth.forEach((x, i) => b.l(x.a.en, x.a.zh, x.amt, ots[i], 'in', 1));
        trOth = Tsum(`其他收益净额 = ${oth.map(x => `${x.a.zh} ${fmt(x.amt)}`).join(' + ')} = ${m$(P.othTot)}。这些是非经营项目，盈利质量分析时通常看得比营业利润轻。`, ...ots);
        b.s('Total other income (expense), net', '其他收益净额', P.othTot, trOth, 'out', 1);
      }
      trPBT = Tsum(`持续经营税前利润 = 营业利润 ${m$(P.opProfit)} + 其他收益净额 ${m$(P.othTot)} = ${m$(P.pbt)}`, trOP, trOth);
    } else {
      b.h('Revenue and other income:', '收入及其他收益：');
      const inc = [...P.rev.filter(nz), ...P.oth.filter(x => x.a.t === 'R' && nz(x))];
      const its = inc.map(x => T(x.ids, acctWhy(x.a.c, '贷方发生额')));
      inc.forEach((x, i) => b.l(x.a.en, x.a.zh, x.amt, its[i], 'in', 1));
      const incTot = inc.reduce((s, x) => s + x.amt, 0);
      const trInc = Tsum(`收入及其他收益 = ${inc.map(x => `${x.a.zh} ${m$(x.amt)}`).join(' + ')} = ${m$(incTot)}`, ...its);
      b.s('Total revenue and other income', '收入及其他收益合计', incTot, trInc, 'out', 1);
      b.h('Expenses:', '费用：');
      const exps = [...P.opx.filter(nz), ...P.oth.filter(x => x.a.t === 'X' && nz(x)).map(x => ({...x, amt:-x.amt, ids:new Map([...x.ids].map(([k, v]) => [k, -v]))}))];
      const ets = exps.map(x => T(x.ids, `按性质列报：${x.a.natZh || x.a.zh}，不管属于哪个部门都合并在这一行。`));
      exps.forEach((x, i) => b.l(x.a.natEn || x.a.en, x.a.natZh || x.a.zh, x.amt, ets[i], 'in', 1));
      const expTot = exps.reduce((s, x) => s + x.amt, 0);
      const trExp = Tsum(`费用合计 = ${m$(expTot)}`, ...ets);
      b.s('Total expenses', '费用合计', expTot, trExp, 'out', 1);
      trPBT = Tsum(`持续经营税前利润 = 收入及其他收益 ${m$(incTot)} − 费用 ${m$(expTot)} = ${m$(P.pbt)}`, trInc, trExp);
    }
    b.s('Profit from continuing operations before income tax', '持续经营税前利润', P.pbt, trPBT, 'out', 0);
    const trTax = T(P.tax.ids, `所得税费用（持续经营部分）。${R.taxE ? R.taxE.calc : ''}`);
    b.l('Income tax expense', '所得税费用', P.tax.amt, trTax, 'out', 0);
    const trCont = Tsum(`持续经营利润 = 税前利润 ${m$(P.pbt)} − 所得税 ${m$(P.tax.amt)} = ${m$(P.cont)}`, trPBT, trTax);
    b.s('Profit from continuing operations', '持续经营利润', P.cont, trCont, 'out', 0);
    if (P.hasDisc) {
      b.h('Discontinued operations:', '终止经营：');
      const td = T(P.disc.ids, '终止经营部门的税前损益：已出售时 = 经营损益 + 处置利得/损失；年末持有待售时 = 经营损益 + 减值损失。');
      const tt = T(P.discTax.ids, `终止经营应承担的所得税（亏损时是税收利益）。${R.taxE ? R.taxE.calc : ''}`);
      b.l('Profit/(loss) from operations of discontinued component (incl. gain/loss on disposal or impairment)', '终止经营部门税前损益（含处置损益或减值）', P.disc.amt, td, 'in', 1);
      b.l(P.discTax.amt >= 0 ? 'Income tax benefit' : 'Income tax expense', P.discTax.amt >= 0 ? '所得税利益' : '所得税费用', P.discTax.amt, tt, 'in', 1);
      b.s(`${P.discNet < 0 ? 'Loss' : 'Profit'} on discontinued operations, net of tax`, '终止经营税后损益（单一金额）', P.discNet, Tsum(`终止经营税后 = ${fmt(P.disc.amt)} + ${fmt(P.discTax.amt)} = ${fmt(P.discNet)}`, td, tt), 'out', 1);
    }
    const npEn = `Net ${P.np < 0 ? 'loss' : 'profit'} for the year`;
    if (part === 'pl') b.g(npEn, '本年净利润', P.np, trNPw); else b.s(npEn, '本年净利润', P.np, trNPw, 'out', 0);
    if (part === 'pl') epsRows(b);
  }
  if (part !== 'pl') {
    if (part === 'oci') b.l(`Net ${P.np < 0 ? 'loss' : 'profit'} for the year`, '本年净利润（来自损益表）', P.np, trNPw, 'out', 0);
    b.h('Other comprehensive income:', '其他综合收益：');
    b.h('Items that will not be reclassified to profit or loss:', '不会重分类至损益的项目：', 1);
    const ocis = P.oci.filter(nz);
    const ots = ocis.map(x => T(x.ids, `${x.a.zh}：${x.a.c === '9000' ? '土地重估增值，累积在权益的「重估盈余」' : 'FVOCI 股权投资的公允价值变动，累积在「公允价值储备」'}，不进净利润。`));
    const ociName = {'9000':['Revaluation surplus on land','土地重估盈余'], '9100':['Fair value gain/(loss) on investments at FVOCI','FVOCI 投资公允价值变动']};
    ocis.forEach((x, i) => b.l(ociName[x.a.c][0], ociName[x.a.c][1], x.amt, ots[i], 'in', 2));
    if (!ocis.length) b.l('None this year', '本年没有', 0, null, 'in', 2);
    const trOCI = Tsum(`本年 OCI 合计 = ${m$(P.ociTot)}（税后）`, ...ots);
    b.s('Other comprehensive income for the year, net of tax', '本年其他综合收益（税后）', P.ociTot, trOCI, 'out', 1);
    b.g('Total comprehensive income for the year', '本年综合收益总额', P.tci, Tsum(`综合收益总额 = 净利润 ${m$(P.np)} + OCI ${m$(P.ociTot)} = ${m$(P.tci)}`, trNP, trOCI));
    if (part === 'all') epsRows(b);
  }
  return b.rows;
}
function epsRows(b){
  const P = R.P; if (!(P.wSh > 0)) return;
  const wtxt = `加权平均股数 = ${P.wParts.join(' + ')} = ${Math.round(P.wSh).toLocaleString('en-US')} 股`;
  const tr = v => T(null, `EPS = ${m$(v)} ÷ ${Math.round(P.wSh).toLocaleString('en-US')} 股 = ${(v / 100 / P.wSh).toFixed(4)}，四舍五入到两位小数。${wtxt}`);
  b.sp();
  b.h('Earnings per share (basic)', '每股收益（基本）');
  if (P.hasDisc) {
    b.l('Profit from continuing operations', '持续经营', P.eps(P.cont), tr(P.cont), 'out', 1, {fmt:'eps'});
    b.l(`${P.discNet < 0 ? 'Loss' : 'Profit'} from discontinued operations`, '终止经营', P.eps(P.discNet), tr(P.discNet), 'out', 1, {fmt:'eps'});
    b.s(`Net ${P.np < 0 ? 'loss' : 'profit'}`, '净利润', P.eps(P.np), tr(P.np), 'out', 1, {fmt:'eps'});
  } else b.l(`Net ${P.np < 0 ? 'loss' : 'profit'}`, '净利润', P.eps(P.np), tr(P.np), 'out', 1, {fmt:'eps'});
}

/* ---------- financial position ---------- */
function sfpRows(){
  const b = RB(), P = R.P;
  const line = (codes, sign, en, zh, ind = 2) => {
    const open = codes.reduce((x, c) => x + (R.OB[c] || 0), 0) * sign;
    const close = codes.reduce((x, c) => x + R.bal(c), 0) * sign;
    const c = R.col(p => codes.includes(p.a), sign);
    if (!open && !close && !c.ids.size) return null;
    let dr = 0, cr = 0; for (const p of R.POST) if (codes.includes(p.a)) { if (p.s > 0) dr += p.s; else cr -= p.s; }
    const tr = T(withOB(c.ids, open), `期末余额 = 期初 ${m$(open)} + 本期借方 ${m$(dr)} − 本期贷方 ${m$(cr)}${sign < 0 ? '（贷方余额账户，所以取相反符号）' : ''} = ${m$(close)}`);
    b.l(en, zh, close, tr, 'out', ind, {v2:open});
    return {close, open, tr};
  };
  const tot = (arr, en, zh, ind, grand) => {
    const xs = arr.filter(Boolean);
    const close = xs.reduce((s, x) => s + x.close, 0), open = xs.reduce((s, x) => s + x.open, 0);
    const tr = Tsum(`${zh} = ${xs.length ? '上面各项之和' : '0'} = ${m$(close)}（上年 ${m$(open)}）`, ...xs.map(x => x.tr));
    if (grand) b.g(en, zh, close, tr, 'out', {v2:open}); else b.s(en, zh, close, tr, 'out', ind, {v2:open});
    return {close, open, tr};
  };
  b.h('ASSETS', '资产');
  b.h('Non-current assets', '非流动资产', 1);
  const land = line(['1500'], 1, 'Land', '土地');
  const eqp = line(['1510'], 1, 'Equipment, at cost', '设备（成本）');
  const ad = line(['1515'], 1, 'Less: accumulated depreciation', '减：累计折旧');
  let ppe;
  if (eqp && ad) ppe = tot([eqp, ad], 'Equipment, net', '设备净额', 2); else ppe = eqp || ad;
  const inv = line(['1600'], 1, 'Investments at FVOCI', 'FVOCI 股权投资');
  const nca = tot([land, ppe, inv], 'Total non-current assets', '非流动资产合计', 1);
  b.h('Current assets', '流动资产', 1);
  const invt = line(['1200'], 1, 'Inventories', '存货');
  const ar = line(['1100'], 1, 'Accounts receivable', '应收账款');
  const al = line(['1105'], 1, 'Less: allowance for doubtful accounts', '减：坏账准备');
  let arN; if (ar && al) arN = tot([ar, al], 'Accounts receivable, net', '应收账款净额', 2); else arN = ar || al;
  const ir = line(['1110'], 1, 'Interest receivable', '应收利息');
  const pp = line(['1300'], 1, 'Prepaid expenses', '预付费用');
  const cash = line(['1000'], 1, 'Cash and cash equivalents', '现金及现金等价物');
  const hfs = line(['1450'], 1, 'Assets held for sale', '持有待售资产');
  const ca = tot([invt, arN, ir, pp, cash, hfs], 'Total current assets', '流动资产合计', 1);
  const ta = tot([nca, ca], 'TOTAL ASSETS', '资产总计', 0, true);
  b.sp();
  b.h('EQUITY AND LIABILITIES', '权益及负债');
  b.h('Equity', '权益', 1);
  const sc = line(['3000'], -1, 'Share capital', '股本');
  // retained earnings (pre-closing: opening + profit − dividends)
  const reOpen = -((R.OB['3100'] || 0) + (R.OB['3300'] || 0));
  const reIds = new Map(); if (reOpen) reIds.set('OB', reOpen); reIds.set('NP', P.np);
  for (const p of R.POST) if (p.a === '3100' || p.a === '3300') reIds.set(p.id, (reIds.get(p.id) || 0) - p.s);
  const reTr = T(reIds, `期末留存收益 = 期初 ${m$(reOpen)} + 本年净利润 ${m$(P.np)} − 宣告股利 ${m$(R.bal('3300'))}${R.MV['3100'] ? ` + 其他直接变动 ${m$(-R.MV['3100'])}` : ''} = ${m$(R.reEnd)}。结账前，净利润还停留在收入费用账户里，所以这里要把它加进来。`, {hits:P.plHits});
  b.l('Retained earnings', '留存收益', R.reEnd, reTr, 'out', 2, {v2:reOpen});
  const re = {close:R.reEnd, open:reOpen, tr:reTr};
  const resv = (code, ociCode, en, zh) => {
    const open = -(R.OB[code] || 0), oc = P.ociOf(ociCode), close = -R.bal(code) + oc.amt;
    if (!open && !close && !oc.ids.size && !(R.MV[code])) return null;
    const ids = new Map(); if (open) ids.set('OB', open);
    for (const [k, v] of oc.ids) ids.set(k, (ids.get(k) || 0) + v);
    for (const p of R.POST) if (p.a === code) ids.set(p.id, (ids.get(p.id) || 0) - p.s);
    const tr = T(ids, `期末 = 期初 ${m$(open)} + 本年 OCI ${m$(oc.amt)} = ${m$(close)}。这就是「累计其他综合收益」。`);
    b.l(en, zh, close, tr, 'out', 2, {v2:open});
    return {close, open, tr};
  };
  const rv = resv('3200', '9000', 'Revaluation surplus', '重估盈余');
  const fv = resv('3210', '9100', 'Fair value reserve', '公允价值储备');
  const te = tot([sc, re, rv, fv], 'Total equity', '权益合计', 1);
  b.h('Non-current liabilities', '非流动负债', 1);
  const ltb = line(['2500'], -1, 'Long-term borrowings', '长期借款');
  const ncl = tot([ltb], 'Total non-current liabilities', '非流动负债合计', 1);
  b.h('Current liabilities', '流动负债', 1);
  const cls = [['2000','Accounts payable','应付账款'],['2100','Salaries payable','应付职工薪酬'],['2150','Interest payable','应付利息'],['2200','Income tax payable','应交所得税'],['2300','Unearned revenue (contract liability)','预收收入（合同负债）'],['2400','Dividends payable','应付股利']].map(([c, en, zh]) => line([c], -1, en, zh));
  const cl = tot(cls, 'Total current liabilities', '流动负债合计', 1);
  const tl = tot([ncl, cl], 'Total liabilities', '负债合计', 1);
  const tel = tot([te, tl], 'TOTAL EQUITY AND LIABILITIES', '权益及负债总计', 0, true);
  return {rows:b.rows, ta, tel};
}

/* ---------- cash flows ---------- */
function scfRows(){
  const b = RB(), CF = R.CF, P = R.P, method = S.settings.cfMethod;
  const netLab = (v, act, zh) => [`Net cash ${v < 0 ? 'used in' : 'from'} ${act} activities`, `${zh}活动产生的现金流量净额`];
  b.h('Cash flows from operating activities', '经营活动现金流量');
  let trOp;
  if (method === 'indirect') {
    const trNP = T(new Map([['NP', P.np]]), '间接法从净利润（包括终止经营）出发，再把权责发生制下的非现金项目和营运资本变动调整掉。', {hits:P.plHits});
    b.l(`Net ${P.np < 0 ? 'loss' : 'profit'} for the year`, '本年净利润', P.np, trNP, 'in', 1);
    const trs = [trNP];
    if (CF.adjAgg.length) {
      b.h('Adjustments for non-cash and investing items:', '调整非现金及投资类项目：', 1);
      for (const a of CF.adjAgg) { const L = ADJ_LABEL[a.key] || ADJ_LABEL.other; const t = T(a.ids, `${L[1]}：影响了净利润但没有经营现金流动（或者现金已经整笔列入投资活动），所以${a.amt > 0 ? '加回' : '减去'}。`); trs.push(t); b.l(L[0], L[1], a.amt, t, 'in', 2); }
    }
    if (CF.wc.length) {
      b.h('Changes in working capital:', '营运资本变动：', 1);
      for (const w of CF.wc) {
        const L = WC_LABEL[w.k] || [w.k, w.k];
        const d = w.close - w.open, up = w.isAsset ? d > 0 : d < 0;
        const en = `${up ? 'Increase' : 'Decrease'} in ${L[0]}`, zh = `${L[1]}${up ? '增加' : '减少'}`;
        const openS = w.isAsset ? w.open : -w.open, closeS = w.isAsset ? w.close : -w.close;
        const t = T(w.ids, `${L[1]}：期初 ${m$(openS)} → 期末 ${m$(closeS)}。${w.isAsset ? (up ? '经营性资产增加，说明收入/费用里有一部分还没收到现金或已提前付出现金，所以减去' : '经营性资产减少，释放出现金，所以加回') : (up ? '经营性负债增加，说明费用已确认但现金还没付，所以加回' : '经营性负债减少，说明本期多付了现金，所以减去')}。`);
        trs.push(t); b.l(en, zh, w.amt, t, 'in', 2);
      }
    }
    trOp = Tsum(`间接法：净利润 ${m$(P.np)} + 调整项 ${m$(CF.adjAgg.reduce((s, x) => s + x.amt, 0))} + 营运资本变动 ${m$(CF.wc.reduce((s, x) => s + x.amt, 0))} = ${m$(CF.indirectTot)}；和直接法 ${m$(CF.opTot)} ${CF.indirectTot === CF.opTot ? '相等 ✓' : '不相等 ✗'}`, ...trs);
    const [en, zh] = netLab(CF.indirectTot, 'operating', '经营');
    b.s(en, zh, CF.indirectTot, trOp, 'out', 0);
  } else {
    const trs = CF.opD.map(x => { const L = OP_LABEL[x.key] || OP_LABEL.otherOpex; const t = T(x.ids, `直接法：${L[1]}。把现金账户里所有属于这一类的收付款加总。`); b.l(L[0], L[1], x.amt, t, 'in', 1); return t; });
    if (!CF.opD.length) b.l('No operating cash flows', '没有经营现金流量', 0, null, 'in', 1);
    trOp = Tsum(`直接法经营现金流量 = ${m$(CF.opTot)}`, ...trs);
    const [en, zh] = netLab(CF.opTot, 'operating', '经营');
    b.s(en, zh, CF.opTot, trOp, 'out', 0);
  }
  const sec = (list, labels, act, en0, zh0) => {
    b.h(en0, zh0);
    const trs = list.map(x => { const L = IF_LABEL[x.key] || [x.key, x.key]; const t = T(x.ids, `${L[1]}：投资和筹资活动总是用直接法，并且流入、流出分别列示（不能互相抵销）。`); b.l(L[0], L[1], x.amt, t, 'in', 1); return t; });
    if (!list.length) b.l('None', '无', 0, null, 'in', 1);
    const tot = list.reduce((s, x) => s + x.amt, 0);
    const [en, zh] = netLab(tot, act, labels);
    const tr = Tsum(`${zh} = ${m$(tot)}`, ...trs);
    b.s(en, zh, tot, tr, 'out', 0);
    return tr;
  };
  const trInv = sec(R.CF.inv, '投资', 'investing', 'Cash flows from investing activities', '投资活动现金流量');
  const trFin = sec(R.CF.fin, '筹资', 'financing', 'Cash flows from financing activities', '筹资活动现金流量');
  b.s(`Net ${CF.net < 0 ? 'decrease' : 'increase'} in cash and cash equivalents`, '现金及现金等价物净增加额', CF.net, Tsum(`经营 ${m$(CF.opTot)} + 投资 ${m$(CF.invTot)} + 筹资 ${m$(CF.finTot)} = ${m$(CF.net)}`, trOp, trInv, trFin), 'out', 0);
  b.l(`Cash and cash equivalents at 1 January ${R.yr}`, '年初现金及现金等价物', CF.openCash, T(new Map([['OB', CF.openCash]]), '来自期初余额（上年末财务状况表）。'), 'out', 0);
  b.g(`Cash and cash equivalents at 31 December ${R.yr}`, '年末现金及现金等价物', CF.closeCash, Tsum(`期初 ${m$(CF.openCash)} + 净增加 ${m$(CF.net)} = ${m$(CF.openCash + CF.net)}，与财务状况表中的现金 ${m$(R.bal('1000'))} ${CF.openCash + CF.net === R.bal('1000') ? '一致 ✓' : '不一致 ✗'}`, trOp, trInv, trFin));
  return b.rows;
}

/* ---------- changes in equity ---------- */
function soceData(){
  const P = R.P;
  const colsAll = [{c:'3000', en:'Share capital', zh:'股本'}, {c:'3100', en:'Retained earnings', zh:'留存收益'}, {c:'3200', en:'Revaluation surplus', zh:'重估盈余', oci:'9000'}, {c:'3210', en:'Fair value reserve', zh:'公允价值储备', oci:'9100'}];
  const cols = colsAll.filter(c => c.c === '3000' || c.c === '3100' || R.OB[c.c] || R.MV[c.c] || (c.oci && P.ociOf(c.oci).ids.size));
  const cell = (v, tr) => ({v, tr});
  const rows = [];
  const open = cols.map(c => { const v = -((R.OB[c.c] || 0) + (c.c === '3100' ? (R.OB['3300'] || 0) : 0)); return cell(v, T(new Map(v ? [['OB', v]] : []), `${c.zh}期初余额（上年末财务状况表）。`)); });
  rows.push({k:'l', en:`Balance at 1 January ${R.yr}`, zh:`${R.yr} 年 1 月 1 日余额`, cells:open});
  const npRow = cols.map(c => c.c === '3100' ? cell(P.np, T(new Map([['NP', P.np]]), '本年净利润（来自损益表）进入留存收益。', {hits:P.plHits})) : cell(null));
  rows.push({k:'l', en:`${P.np < 0 ? 'Loss' : 'Profit'} for the year`, zh:'本年净利润', cells:npRow, ind:1});
  const ociRow = cols.map(c => { if (!c.oci) return cell(null); const o = P.ociOf(c.oci); return cell(o.amt, T(o.ids, `本年 OCI 进入${c.zh}。`)); });
  rows.push({k:'l', en:'Other comprehensive income', zh:'其他综合收益', cells:ociRow, ind:1});
  const tciRow = cols.map((c, i) => { const a = npRow[i].v || 0, o = ociRow[i].v || 0; return cell(npRow[i].v == null && ociRow[i].v == null ? null : a + o, Tsum('净利润 + OCI', npRow[i].tr, ociRow[i].tr)); });
  rows.push({k:'s', en:'Total comprehensive income for the year', zh:'本年综合收益总额', cells:tciRow});
  rows.push({k:'h', en:'Transactions with owners:', zh:'与所有者的交易：'});
  const own = [];
  const shc = R.acol('3000', -1);
  if (shc.ids.size) own.push({k:'l', en:'Issue of ordinary shares', zh:'发行普通股', ind:1, cells:cols.map(c => c.c === '3000' ? cell(shc.amt, T(shc.ids, '本年发行股份，股本增加。')) : cell(null))});
  const dv = R.acol('3300', -1);
  if (dv.ids.size) own.push({k:'l', en:'Dividends declared', zh:'宣告股利', ind:1, cells:cols.map(c => c.c === '3100' ? cell(dv.amt, T(dv.ids, '宣告股利减少留存收益。股利是分配，不是费用。')) : cell(null))});
  const oth = cols.map(c => { const x = R.acol(c.c, -1); return x.ids.size && c.c !== '3000' ? cell(x.amt, T(x.ids, `直接记入${c.zh}的其他分录。`)) : cell(null); });
  if (oth.some(x => x.v != null)) own.push({k:'l', en:'Other movements', zh:'其他变动', ind:1, cells:oth});
  if (!own.length) own.push({k:'l', en:'None this year', zh:'本年没有', ind:1, cells:cols.map(() => cell(null))});
  rows.push(...own);
  const close = cols.map((c, i) => { let v = 0; const trs = []; for (const r of rows) if (r.cells && r.k === 'l') { v += r.cells[i].v || 0; trs.push(r.cells[i].tr); } return cell(v, Tsum(`${c.zh}期末 = 期初 + 本年各项变动 = ${m$(v)}，与财务状况表一致。`, ...trs)); });

function customTotals(){
  let d = 0, c = 0; for (const r of UI.custom.rows) { const x = money(r.dr), y = money(r.cr); if (Number.isFinite(x)) d += x; if (Number.isFinite(y)) c += y; }
  return {d, c};
}
function buildCustom(c){
  const g = []; let dr = 0, cr = 0;
  for (const r of c.rows) {
    const d = money(r.dr), k = money(r.cr);
    const hd = Number.isFinite(d) && d !== 0, hk = Number.isFinite(k) && k !== 0;
    if ((String(r.dr).trim() && !Number.isFinite(d)) || (String(r.cr).trim() && !Number.isFinite(k))) return {err:`${acctZh(r.a)}：金额格式不对`};
    if (!hd && !hk) continue;
    if (hd && hk) return {err:`${acctZh(r.a)}：同一行只能填借方或贷方`};
    if ((hd && d < 0) || (hk && k < 0)) return {err:'金额请填正数'};
    const fn = normFn(r.a, r.fn);
    if (hd) { g.push(fn ? {a:r.a, s:d, fn} : {a:r.a, s:d}); dr += d; } else { g.push(fn ? {a:r.a, s:-k, fn} : {a:r.a, s:-k}); cr += k; }
  }
  if (!g.some(l => l.s > 0) || !g.some(l => l.s < 0)) return {err:'至少要有一个借方和一个贷方'};
  if (dr !== cr) return {err:`借方合计 ${fmt(dr)} ≠ 贷方合计 ${fmt(cr)}，相差 ${fmt(Math.abs(dr - cr))}`};
  return {groups:[g]};
}

function parseGuess(s){
  let t = String(s || '').trim(); if (!t) return null;
  let neg = false;
  if (/^\(.*\)$/.test(t)) { neg = true; t = t.slice(1, -1); }
  t = t.replace(/[,\s$]/g, '').replace(/HK/gi, '');
  if (t.startsWith('-') || t.startsWith('−')) { neg = !neg; t = t.slice(1); }
  if (t === '–' || t === '-') return 0;
  const n = parseFloat(t); if (!Number.isFinite(n)) return NaN;
  return neg ? -n : n;
}

function parseAI(j){

      const a = String(l && (l.acct ?? l.account) || '').trim();
      if (!ACC[a] || ACC[a].hidden) throw `AI 用了本页没有的账户代码「${a}」，请换个说法再试。`;

    <p class="err" id="bk-msg"></p></div>`;

function importJSON(text){
  try {
    const s = JSON.parse(text);
    if (!s || !s.company || !Array.isArray(s.txns)) throw 0;
    const snap = snapshot();
    S = normalize(s); UI.sel = null; UI.editing = null; save();
    $('#modal').hidden = true; renderAll();
    toast('已导入备份', () => restore(snap));
  } catch (e) { const m = $('#bk-msg'); if (m) m.textContent = '导入失败：这不是本页导出的 JSON。'; }
}

    prompt:'同上题，但到 12 月 31 日年结时部门还<b>没有</b>卖出：<br>• 本年部门税前经营亏损 $5,000,000。<br>• 12 月 31 日部门资产账面价值 $12,000,000，公允价值减出售成本 $9,000,000。<br>税后持续经营利润 $20,000,000，税率 20%。',
    blanks:[{label:'减值损失',answer:3000000},{label:'终止经营税后损益',answer:-6400000},{label:'净利润',answer:13600000}],
    exp:'<p>年末持有待售时，终止经营损益 = 本年经营损益 + 减值损失（账面价值高于公允价值减出售成本的部分）：</p><p class="calc">减值 = 12,000,000 − 9,000,000 = 3,000,000<br>税前 = −5,000,000 − 3,000,000 = −8,000,000<br>所得税利益 = 8,000,000 × 20% = 1,600,000<br>税后 = −6,400,000<br>净利润 = 20,000,000 − 6,400,000 = 13,600,000</p>'},
  {id:'c3-class', ch:3, type:'num', cur:'$', lab:'duluthClass', title:'课堂练习：公允价值高于账面价值',
    prompt:'同上题（年末未售出），但 12 月 31 日部门资产账面价值 $12,000,000，公允价值减出售成本为 <b>$14,000,000</b>。其他条件不变。',
    blanks:[{label:'减值损失（没有就填 0）',answer:0},{label:'终止经营税后损益',answer:-4000000},{label:'净利润',answer:16000000}],
    exp:'<p>持有待售资产按账面价值与公允价值减出售成本<b>孰低</b>计量。公允价值减出售成本 14,000,000 高于账面 12,000,000，所以不确认减值，也<b>不确认利得</b>（资产不会被写高）。</p><p class="calc">税前 = −5,000,000<br>所得税利益 = 1,000,000<br>税后 = −4,000,000<br>净利润 = 20,000,000 − 4,000,000 = 16,000,000</p>'},
  {id:'c3-eps', ch:3, type:'num', cur:'$', lab:'ravel', title:'终止经营与 EPS',
    prompt:'Ravel 公司本年税后持续经营利润 $600,000。年内出售了一个部门：该部门本年税前经营亏损 $90,000，出售部门资产损失 $160,000。税率 20%，全年流通普通股 50,000 股。',
    blanks:[{label:'终止经营税后损益',answer:-200000},{label:'净利润',answer:400000},{label:'EPS：持续经营',answer:12,unit:'eps'},{label:'EPS：终止经营',answer:-4,unit:'eps'},{label:'EPS：净利润',answer:8,unit:'eps'}],
    exp:'<p class="calc">终止经营税前 = −90,000 − 160,000 = −250,000<br>所得税利益 = 250,000 × 20% = 50,000<br>终止经营税后 = −200,000<br>净利润 = 600,000 − 200,000 = 400,000<br>EPS：持续经营 600,000 ÷ 50,000 = 12.00<br>　　　终止经营 −200,000 ÷ 50,000 = (4.00)<br>　　　净利润 400,000 ÷ 50,000 = 8.00</p><p>有终止经营时，EPS 要分别列示持续经营、终止经营和净利润三个数字。</p>'},
  {id:'c3-pl', ch:3, type:'num', cur:'$', lab:'fnFormat', title:'多步式损益表（按功能）',
    prompt:'某公司本年资料：销售收入 $800,000；销售成本 $450,000；销售费用 $90,000；管理费用 $70,000；利息收入 $6,000；利息费用 $16,000；处置设备利得 $12,000。所得税率 20%，没有终止经营。',
    blanks:[{label:'毛利',answer:350000},{label:'营业利润',answer:190000},{label:'持续经营税前利润',answer:192000},{label:'净利润',answer:153600}],
    exp:'<p class="calc">毛利 = 800,000 − 450,000 = 350,000<br>营业利润 = 350,000 − 90,000 − 70,000 = 190,000<br>其他收益净额 = 6,000 + 12,000 − 16,000 = 2,000<br>税前利润 = 190,000 + 2,000 = 192,000<br>所得税 = 192,000 × 20% = 38,400<br>净利润 = 153,600</p><p>利息收入、利息费用和处置利得都是<b>非经营项目</b>，列在营业利润之后。如果按性质列报，就没有毛利和营业利润这两个小计，但税前利润同样是 192,000。</p>'},
  {id:'c3-ci', ch:3, type:'num', cur:'$', title:'综合收益',
    prompt:'某公司本年净利润 $1,200（单位：千元）。本年还发生下列事项（均为税后金额）：土地重估增值 $150；FVOCI 投资未实现持有损失 $40；外币报表折算利得 $10；出售设备利得 $30；宣告现金股利 $200。',
    blanks:[{label:'其他综合收益（OCI）合计',answer:120},{label:'综合收益总额',answer:1320}],
    exp:'<p class="calc">OCI = 150 − 40 + 10 = 120<br>综合收益 = 1,200 + 120 = 1,320</p><p>出售设备利得已经包含在净利润里，不能重复计算；宣告股利是与股东的交易，既不是费用，也不属于综合收益。</p>'},
  {id:'c3-oci', ch:3, type:'multi', prompt:'下列哪些项目计入<b>其他综合收益（OCI）</b>？（多选）',
    options:['土地重估增值（重估盈余）','FVOCI 投资的未实现持有利得','出售设备利得','境外经营的外币折算差额','宣告现金股利','设定受益计划（退休后福利）的利得或损失','终止经营损失'], answer:[0,1,3,5],
    exp:'<p>课件列出的 OCI 项目：重估盈余、投资未实现持有利得或损失、退休后福利计划损益、衍生工具递延损益、外币折算损益。出售设备利得和终止经营损失都进<b>净利润</b>；股利是对股东的分配，不在综合收益里。</p>'},
  {id:'c3-chg', ch:3, type:'match', title:'会计变更的类型',
    prompt:'判断每一项属于哪种会计变更，以及处理方向。口诀：政策看过去，估计看未来，差错回过去。',
    choices:['会计政策变更：追溯调整','会计估计变更：未来适用','前期差错：追溯重述'],
    items:[['存货计价方法由先进先出法改为加权平均法。',0],['机器的剩余使用年限由 8 年改为 5 年。',1],['折旧方法由直线法改为余额递减法。',1],['发现上年漏记了 200 万元折旧。',2],['坏账估计率由 3% 调整为 5%。',1],['新信息显示产品保修费用的估计比例应下调。',1]],
    exp:'<p>先问自己：方法变了？新信息来了？还是原来错了？</p><ul><li>从一种可接受的方法换成另一种（例如存货计价）= 会计政策变更，自愿变更要追溯调整以前年度的报表。</li><li>使用年限、残值、坏账率、保修费用都是估计，有新信息时修改 = 会计估计变更，未来适用；影响重大时在附注说明对净利润和 EPS 的影响。</li><li><b>折旧方法的改变</b>在课件中视为会计估计变更，同样未来适用。</li><li>漏记折旧是前期差错，要追溯重述比较期间。</li></ul>'},
  {id:'c3-eq', ch:3, type:'mc', prompt:'分析师要预测公司明年的利润。下列哪一项最有参考价值？',
    options:['出售投资取得的利得','一次性重组费用','核心业务的营业利润','终止经营的损失'], answer:2,
    exp:'<p>盈利质量看的是当期利润预测未来利润的能力。<b>永久性利润</b>来自会持续发生的交易，核心营业利润最具持续性。出售投资的利得、重组费用属于暂时性项目；终止经营以后不会再发生。一般来说：持续经营 &gt; 终止经营；营业利润 &gt; 非经营项目（但也有例外，例如利息费用每年都会发生）。</p>'},
  {id:'c3-shift', ch:3, type:'mc', prompt:'某公司把一部分日常营业费用归到营业利润以下的「其他费用」中。营业利润因此看起来更高，净利润不变。这种做法叫做？',
    options:['收益平滑 Income smoothing','分类转移 Classification shifting','追溯调整 Retrospective adjustment','备考利润 Pro forma earnings'], answer:1,
    exp:'<p><b>分类转移</b>是把营业费用转到非经营项目，让营业利润（投资者更看重、也更具持续性的数字）好看。<b>收益平滑</b>是通过改变假设和估计让各年利润波动变小，例如今年多估费用、以后年度再转回。<b>Pro forma（非 GAAP）利润</b>是管理层自行剔除某些项目后的利润。</p>'},
  {id:'c3-je-hfs', ch:3, type:'je', prompt:'12 月 31 日，持有待售的部门资产账面价值 HK$12,000，公允价值减出售成本 HK$9,000。请写出确认减值的分录（本页把减值记入「终止经营税前损益」）。', je:[['8500',3000],['1450',-3000]],
    exp:'<p>减值 = 12,000 − 9,000 = 3,000。借记终止经营损益（它会和部门本年的经营损益合并，扣税后以单一金额列报），贷记持有待售资产，把资产写到公允价值减出售成本。</p>'},
  {id:'c3-je-sell', ch:3, type:'je', prompt:'出售一台旧设备：原始成本 HK$40,000，已提累计折旧 HK$30,000，收到现金 HK$14,000。请写出分录。', je:[['1000',14000],['1515',30000],['1510',-40000],['4600',-4000]],
    exp:'<p class="calc">账面价值 = 40,000 − 30,000 = 10,000<br>利得 = 14,000 − 10,000 = 4,000</p><p>要同时冲销设备成本和累计折旧，把这项资产从账上完全移除。利得列在损益表的「其他收益」。在现金流量表里，14,000 全部列为投资活动流入；间接法要从净利润中减去 4,000 的利得，避免重复计算。</p>'},
  {id:'c3-je-reval', ch:3, type:'je', prompt:'公司对土地采用重估模型。土地账面价值 HK$200,000，年末公允价值 HK$230,000。请写出分录（本页把重估增值记入「OCI：土地重估利得」）。', je:[['1500',30000],['9000',-30000]],
    exp:'<p>重估增值 30,000 记入其他综合收益，不进净利润；结账时转入权益中的「重估盈余」。所以它会出现在综合收益部分和权益变动表里，但不影响 EPS。</p>'},
  // ---------- Chapter 4
  {id:'c4-class', ch:4, type:'match', title:'现金流量分类',
    prompt:'按课件示例的口径（支付利息列经营、支付股利列筹资），判断每一项的分类。',
    choices:['经营活动','投资活动','筹资活动','非现金活动（附注披露）'],
    items:[['收到客户货款。',0],['购买生产设备。',1],['出售长期股权投资。',1],['发行普通股。',2],['支付现金股利。',2],['支付借款利息。',0],['签发 5 年期票据换取一台设备。',3],['偿还借款本金。',2],['支付所得税。',0]],
    exp:'<p>经营活动 = 产生收入的日常活动（客户、供应商、员工、利息、所得税）；投资活动 = 买卖长期资产和投资；筹资活动 = 与股东和债权人之间的本金往来（发股、借款、还本、分红）。</p><p>IFRS 允许把收到和支付的利息、股利放在不同类别，所以题目要先说明口径；US GAAP 则规定支付利息列经营、支付股利列筹资。</p><p>以票据换设备没有现金流动，不进现金流量表正文，但要在附注中披露为「重大非现金投资及筹资活动」。</p>'},
  {id:'c4-ce', ch:4, type:'mc', prompt:'下列哪一项通常属于<b>现金等价物</b>？',
    options:['购买时离到期还有 2 个月的国库券','购买时离到期还有 6 个月的定期存款','持有的上市公司股票','为偿还债券而限定用途的银行存款'], answer:0,
    exp:'<p>现金等价物是短期、流动性强、可以随时转换为已知金额现金、价值变动风险很小的投资，<b>从购买日起算到期日不超过 3 个月</b>。6 个月的定期存款超过 3 个月；股票价格波动大；限定用途的存款是受限现金，不能随时用来支付。</p>'},
  {id:'c4-cust', ch:4, type:'num', cur:'$', title:'直接法：从客户收到的现金',
    prompt:'本年销售收入 $200（百万，全部先记为赊销）。应收账款年初 $30，年末 $45。本年核销坏账 $3（备抵法）。',
    blanks:[{label:'从客户收到的现金',answer:182}],
    exp:'<p>用应收账款 T 字账倒推：</p><p class="calc">期初 30 + 赊销 200 − 核销 3 − 收现 ? = 期末 45<br>收现 = 30 + 200 − 3 − 45 = 182</p><p>课件的做法：先假设所有销售都是赊销（现销等于马上收回的赊销），再用 T 字账或汇总分录找出现金。核销坏账减少应收账款，但没有收到现金，所以要扣掉。</p>'},
  {id:'c4-supp', ch:4, type:'num', cur:'$', title:'直接法：支付给供应商的现金',
    prompt:'本年销售成本 $120。存货年初 $40，年末 $50。应付账款年初 $25，年末 $20。所有采购都先记为赊购。',
    blanks:[{label:'本年采购额',answer:130},{label:'支付给供应商的现金',answer:135}],
    exp:'<p>分两步：先用存货账户求采购额，再用应付账款账户求付款额。</p><p class="calc">存货：40 + 采购 − 120 = 50 → 采购 = 130<br>应付账款：25 + 130 − 付款 = 20 → 付款 = 135</p><p>存货增加要多付现金；应付账款减少说明还了更多旧账，也是多付现金。</p>'},
  {id:'c4-ind', ch:4, type:'num', cur:'HK$', lab:'cfIndirect', title:'间接法',
    prompt:'某公司本年净利润 HK$34,400，其中包括折旧 HK$10,000 和出售设备利得 HK$3,000（设备售价 HK$15,000）。本年另以现金 HK$40,000 购买设备。营运资本变动：应收账款由 30,000 增至 45,000；存货由 40,000 增至 50,000；应付账款由 25,000 降至 20,000；应交所得税由 0 增至 8,600。',
    blanks:[{label:'经营活动现金流量净额',answer:20000},{label:'投资活动现金流量净额',answer:-25000}],
    exp:'<p class="calc">净利润 34,400<br>+ 折旧 10,000<br>− 出售设备利得 3,000<br>− 应收账款增加 15,000<br>− 存货增加 10,000<br>− 应付账款减少 5,000<br>+ 应交所得税增加 8,600<br>= 经营活动现金流量 20,000</p><p class="calc">投资活动 = 出售设备 15,000 − 购买设备 40,000 = −25,000</p><p>利得要减去：出售设备收到的 15,000 已经整笔列在投资活动，不能在经营活动重复计算。经营性资产增加要减，经营性负债增加要加。</p>'},
  {id:'c4-wc', ch:4, type:'mc', prompt:'用间接法编制现金流量表时，本年应收账款<b>增加</b> HK$15,000，应如何调整？',
    options:['在净利润上加 15,000','从净利润中减去 15,000','不需要调整','列入投资活动'], answer:1,
    exp:'<p>应收账款增加，说明有一部分收入已经确认、但现金还没收到，净利润高于现金，所以要减去。规律：经营性资产增加 → 减；减少 → 加。经营性负债增加 → 加；减少 → 减。</p>'},
  {id:'c4-dvi', ch:4, type:'mc', prompt:'同一家公司分别用直接法和间接法编制现金流量表，哪一部分会不同？',
    options:['只有经营活动部分的列示方式不同，金额相同','投资活动的金额不同','筹资活动的列示方式不同','三个部分都不同'], answer:0,
    exp:'<p>直接法逐项列出经营活动的现金收付（从客户收到、付给供应商、付给员工……）；间接法从净利润出发做调整。两者得到的经营活动现金流量净额<b>完全相同</b>。投资和筹资活动永远用直接法，所以不受影响。工作台的「现金流量表」页可以切换两种方法对比。</p>'},
  {id:'c4-sloan', ch:4, type:'mc', prompt:'Sloan（1996）关于「应计异象」（accrual anomaly）的研究发现了什么？',
    options:['利润中应计部分比例高的公司，随后几年股票表现较差','利润中现金部分比例高的公司，随后几年股票表现较差','利润与未来现金流量完全无关','间接法编制的现金流量表比直接法更准确'], answer:0,
    exp:'<p>应计部分比例高的公司随后表现较差，所以买入现金利润比例高的公司曾是一种赚钱的策略；课件也提到，这种异象近年已被专业投资者交易掉。另一方面，研究发现当期利润对未来经营现金流量的预测能力比当期经营现金流量更强（Dechow et al. 1998）。</p>'},
  {id:'c4-je-nc', ch:4, type:'je', prompt:'9 月 1 日，公司签发一张两年期票据 HK$30,000，换取一台设备，没有支付现金。请写出分录（本页用「长期借款」账户记录这张票据）。', je:[['1510',30000],['2500',-30000]],
    exp:'<p>这笔交易同时有投资（取得设备）和筹资（承担债务）的性质，但没有现金流动，所以不进现金流量表正文，而在附注中作为<b>非现金投资及筹资活动</b>披露。</p>'},
];

const CH_SUM = {
  1:'Conceptual Framework (IASB 2018). Objective: useful financial information for existing and potential investors, lenders and other creditors. Fundamental qualitative characteristics: relevance (predictive value, confirmatory value, materiality: no uniform quantitative threshold, 5% of net income is only a rule of thumb, qualitative factors such as bribes or just meeting analyst forecasts) and faithful representation (completeness, neutrality, free from error). Enhancing: comparability (including consistency), verifiability, timeliness, understandability. Cost constraint. Elements: asset (economic resource controlled, from past events), liability (present obligation to transfer economic resources, from past events), equity (residual), income, expenses. Assumptions: going concern, economic entity, periodicity, monetary unit. Recognition criteria. IFRS 15 revenue recognised when performance obligations are satisfied; expenses matched with related revenue or recognised in the period. Measurement bases: historical cost; current value (fair value, value in use, fulfilment value). Fair value approaches (market, income, cost) and hierarchy levels 1-3. Fair value option.',
  2:'Financial disclosures. Annual report. Required disclosure notes: summary of significant accounting policies (e.g. inventory costing, revenue recognition); subsequent events = significant events between the reporting date and the date the statements are issued (material ones such as debt refinancing, litigation developments, a natural disaster with its estimated loss, merger status are described in a note); noteworthy events: related-party transactions (disclose nature of relationship, description, dollar amounts; arm\'s length principle; connected lending), fraud (intentional) versus error (unintentional) misstatements and market reaction. Management report / MD&A. Auditor\'s report: unqualified, emphasis of matter (going concern, uncertain lawsuit), qualified, disclaimer (scope limited), adverse. Compensation of directors and executives. Other notes: EPS, PPE, fair values, debts, leases, provisions, inventory.',
  3:'Statement of profit or loss and OCI. Revenues, expenses, gains and losses. Multi-step format: sales, cost of goods sold, gross profit, operating expenses (selling, G&A, R&D, restructuring), operating profit, other income (expense) such as interest and gains on sale of investments, profit from continuing operations before tax, income tax, profit from continuing operations, discontinued operations (single after-tax amount), net profit, EPS for continuing / discontinued / net. Function versus nature of expense; IFRS versus US GAAP. Discontinued operations: component sold = operating profit or loss to disposal date + gain or loss on disposal; held for sale at year end = operating profit or loss + impairment loss if book value exceeds fair value less costs to sell (no gain recognised); intraperiod tax allocation (e.g. 20% tax). Earnings quality: permanent versus temporary earnings, operating versus nonoperating, restructuring costs, impairments, pro forma / non-GAAP earnings, income smoothing, classification shifting. Comprehensive income = net profit + OCI (revaluation surplus, unrealised gains and losses on FVOCI investments, post-employment benefit plan gains and losses, deferred gains and losses on derivatives, foreign currency translation); single statement or two consecutive statements. Accounting changes: change in policy (retrospective), change in estimate including depreciation method (prospective), correction of a prior-period error (retrospective restatement).',
  4:'Statement of cash flows. Purpose. Cash, cash equivalents (highly liquid, maturity no more than 3 months from purchase), restricted cash. Operating, investing, financing classification; IFRS lets interest and dividends received and paid be classified differently (course examples: interest paid and received in operating, dividends paid in financing); US GAAP differences. Direct method (cash from customers, to suppliers, to employees, for interest, for taxes) versus indirect method (net profit adjusted for non-cash items such as depreciation, gains and losses on sale of long-term assets, and changes in operating working capital). Investing and financing are always shown directly. Significant noncash investing and financing activities are disclosed in notes. Preparing the direct method with T-accounts or summary journal entries (cash from customers = sales - increase in AR - write-offs; purchases and payments to suppliers through inventory and AP). Accrual anomaly (Sloan 1996); earnings predict future cash flows better than current cash flows (Dechow et al. 1998).',

function qSubmit(q){

    ok = a.sel[0] === q.answer; msg = '这个选项不对。';
  } else if (q.type === 'multi') {
    const s = a.sel || []; if (!s.length) return toast('先选出答案');

    const agg = {}; let d = 0, c = 0, any = false, badFmt = false, noAcct = false;
    for (const r of jeRows(a)) {
      const x = money(r.dr), y = money(r.cr);
      if ((String(r.dr || '').trim() && !Number.isFinite(x)) || (String(r.cr || '').trim() && !Number.isFinite(y))) badFmt = true;

    if (noAcct) return toast('有金额的行还没选账户');
    if (!any) return toast('先写出分录');

    const wrongAcc = [...new Set([...Object.keys(agg), ...Object.keys(want)])].filter(k => (agg[k] || 0) !== (want[k] || 0));
    ok = !wrongAcc.length;
    msg = d !== c ? `借贷不平衡：借方合计 ${fmt(d)}，贷方合计 ${fmt(c)}。` : `借贷平衡，但有 ${wrongAcc.length} 个账户的方向或金额不对。`;

}

function parseAIQ(j, ch, type){
  if (!j || typeof j !== 'object') throw 'AI 返回的内容无法识别，请再试一次。';
  const prompt = String(j.prompt || '').trim(); if (!prompt) throw 'AI 没有给出题目，请再试一次。';
  const P = s => esc(s).replace(/\n/g, '<br>');
  const base = {id:'ai-' + Date.now().toString(36), ch, ai:true, title:esc(String(j.title || '').slice(0, 40)), prompt:P(prompt), exp:`<p>${P(String(j.explain || '（没有详解）'))}</p>`};
  if (type === 'mc') {
    const opts = Array.isArray(j.options) ? j.options.map(o => String(o)) : [], ans = Number(j.answer);
    if (opts.length < 3 || opts.length > 6 || !Number.isInteger(ans) || ans < 0 || ans >= opts.length) throw 'AI 出的选择题格式不完整，请再试一次。';
    return {...base, type:'mc', options:opts.map(o => esc(o)), answer:ans};
  }
  const blanks = (Array.isArray(j.blanks) ? j.blanks : []).slice(0, 5).map(b => ({label:esc(String(b && b.label || '答案')), answer:Number(b && b.answer), unit:b && b.unit === 'eps' ? 'eps' : undefined})).filter(b => Number.isFinite(b.answer));
  if (!blanks.length) throw 'AI 出的计算题没有有效答案，请再试一次。';
  return {...base, type:'num', blanks, cur:String(j.currency || '$').slice(0, 4)};
}
